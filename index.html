<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Stride | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <style>
    @property --angle {
      syntax: '<angle>';
      initial-value: 0deg;
      inherits: false;
    }

    :root {
      --ink: #0b0b0b;
      --muted: #9a9a9a;
      --line: rgba(255, 255, 255, 0.16);
      --orange: #EB7650;
      --ok: #97D86E;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html { background: #000; }

    body {
      background: transparent;
      color: #fff;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
      max-width: 560px;
      margin: 0 auto;
      overflow-x: hidden;
    }

    svg { width: 20px; height: 20px; }

    /* ---------- BACKGROUND ---------- */
    .bg { position: fixed; inset: 0; z-index: -1; background: #020305; overflow: hidden; }
    .glow { position: absolute; border-radius: 50%; filter: blur(70px); will-change: transform; }
    .g-blue {
      width: 80vmax; height: 62vmax; max-width: 620px; max-height: 520px;
      left: -45%; top: -12%;
      background: radial-gradient(closest-side, rgba(24,120,170,0.75), rgba(10,60,95,0.35) 55%, transparent 100%);
      animation: driftA 38s ease-in-out infinite alternate;
    }
    .g-arc {
      width: 110vmax; height: 52vmax; max-width: 900px; max-height: 440px;
      right: -75%; top: 14%;
      background: radial-gradient(closest-side, rgba(255,110,30,0.65), rgba(190,60,10,0.3) 60%, transparent 100%);
      transform: rotate(-24deg);
      animation: driftB 44s ease-in-out infinite alternate;
    }
    .g-orange {
      width: 90vmax; height: 90vmax; max-width: 640px; max-height: 640px;
      left: -10%; bottom: -34%;
      background: radial-gradient(closest-side, rgba(255,105,28,0.6), rgba(160,50,8,0.28) 58%, transparent 100%);
      animation: driftC 50s ease-in-out infinite alternate;
    }
    .g-deep {
      width: 70vmax; height: 70vmax; max-width: 480px; max-height: 480px;
      right: -40%; bottom: -8%;
      background: radial-gradient(closest-side, rgba(10,70,115,0.5), transparent 100%);
      animation: driftA 46s ease-in-out infinite alternate-reverse;
    }
    @keyframes driftA { to { transform: translate3d(70px, 90px, 0) scale(1.12); } }
    @keyframes driftB { from { transform: rotate(-24deg) translate3d(0,0,0); } to { transform: rotate(-18deg) translate3d(-90px, 50px, 0); } }
    @keyframes driftC { to { transform: translate3d(60px, -90px, 0) scale(1.1); } }

    .bg::before {
      content: ""; position: absolute; inset: 0;
      background:
        radial-gradient(120% 70% at 50% 50%, transparent 0%, rgba(0,0,0,0.55) 100%),
        rgba(0,0,0,0.3);
    }
    .bg::after {
      content: ""; position: absolute; inset: 0;
      background-image: radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0) 1px, rgba(0,0,0,0.82) 1.7px);
      background-size: 5px 5px;
    }

    @media (prefers-reduced-motion: reduce) { .glow { animation: none; } }

    /* ---------- HEADER ---------- */
    .header { margin-bottom: 40px; animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }
    .header h1 {
      font-size: clamp(3.2rem, 17vw, 4.8rem);
      font-weight: 400; letter-spacing: -0.045em; line-height: 1; margin-bottom: 14px;
    }
    .header p { color: var(--muted); font-size: 1.1rem; font-weight: 300; }

    /* ---------- FORM ---------- */
    .form-container {
      display: flex; flex-direction: column; gap: 12px;
      animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .input-group { position: relative; }
    .input-group label {
      position: absolute; top: 12px; left: 24px;
      font-size: 0.75rem; font-weight: 500; letter-spacing: .02em;
      color: var(--muted); pointer-events: none;
    }
    .input-field {
      width: 100%; height: 66px;
      padding: 28px 24px 8px 24px;
      border-radius: 33px;
      background: rgba(0, 0, 0, 0.45);
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      border: 1px solid var(--line);
      color: #fff; font-size: 1.05rem; font-weight: 400;
      outline: none;
      transition: border-color .2s ease, background .2s ease, opacity .2s;
    }
    .input-field:focus { border-color: #fff; background: rgba(0, 0, 0, 0.6); }
    .input-field:read-only { opacity: .6; }
    .input-field::-webkit-outer-spin-button,
    .input-field::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }

    select.input-field { appearance: none; -webkit-appearance: none; padding-right: 48px; }
    select.input-field option { background: #111; color: #fff; }
    .select-icon {
      position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }

    .row { display: flex; gap: 12px; }
    .row .input-group { flex: 1; min-width: 0; }

    #otp-section { display: none; }
    #otp-section label { color: var(--orange); }
    #otp-section .input-field { border-color: rgba(235,118,80,0.55); letter-spacing: .3em; }

    .links { display: none; justify-content: space-between; padding: 0 12px; }
    .link-btn {
      background: none; border: 0; cursor: pointer;
      color: var(--muted); font-size: .95rem; padding: 6px 4px;
      text-decoration: underline; text-underline-offset: 3px;
    }
    .link-btn:disabled { text-decoration: none; opacity: .6; cursor: default; }
    .link-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 6px; }

    .status { min-height: 1.3em; padding: 0 14px; font-size: .95rem; text-align: center; color: var(--muted); }
    .status.err { color: var(--orange); }
    .status.ok  { color: var(--ok); }

    /* ---------- BUTTON ---------- */
    .btn {
      position: relative; width: 100%; height: 68px;
      margin-top: 4px;
      border-radius: 34px; border: none;
      background: var(--orange); color: var(--ink);
      font-size: 1.15rem; font-weight: 500; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      z-index: 1;
      transition: transform .18s ease, opacity .2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: .6; cursor: default; }
    .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
    .btn svg { width: 22px; height: 22px; }

    .btn::before {
      content: ""; position: absolute; inset: -3px;
      border-radius: 37px; padding: 2px;
      background: conic-gradient(from var(--angle), transparent 60%, #FFFFFF 80%, transparent 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      z-index: -1; opacity: 0; transition: opacity 0.3s;
    }
    .btn:not(:disabled):hover::before, .btn:not(:disabled):active::before {
      opacity: 1; animation: spin 1.5s linear infinite;
    }

    @keyframes spin { 100% { --angle: 360deg; } }
    @keyframes slideUp { 0% { opacity: 0; transform: translateY(30px); } 100% { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <div class="bg" aria-hidden="true">
    <div class="glow g-blue"></div>
    <div class="glow g-arc"></div>
    <div class="glow g-orange"></div>
    <div class="glow g-deep"></div>
  </div>

  <div class="header">
    <h1>Welcome.</h1>
    <p>Let's get you prepped for JAMB.</p>
  </div>

  <div class="form-container">
    <div class="input-group">
      <input type="text" id="name" class="input-field" placeholder=" " value="John Doe" autocomplete="name">
      <label for="name">Full Name</label>
    </div>

    <div class="row">
      <div class="input-group">
        <input type="number" id="age" class="input-field" placeholder=" " value="17">
        <label for="age">Age</label>
      </div>
      <div class="input-group">
        <select id="course" class="input-field">
          <option value="Sciences">Sciences</option>
          <option value="Arts">Arts</option>
          <option value="Commerce">Commerce</option>
        </select>
        <label for="course">Course</label>
        <i data-lucide="chevron-down" class="select-icon"></i>
      </div>
    </div>

    <div class="input-group">
      <input type="tel" id="phone" class="input-field" placeholder=" " autocomplete="tel">
      <label for="phone">Phone Number</label>
    </div>

    <div class="input-group">
      <input type="email" id="email" class="input-field" placeholder=" " autocomplete="email">
      <label for="email">Email Address</label>
    </div>

    <div class="input-group" id="otp-section">
      <input type="text" id="otp" class="input-field" placeholder=" " inputmode="numeric" maxlength="6" autocomplete="one-time-code">
      <label for="otp">Enter 6-digit Code</label>
    </div>

    <div class="links" id="links">
      <button type="button" class="link-btn" id="change-btn">Change email</button>
      <button type="button" class="link-btn" id="resend-btn">Resend code</button>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <button class="btn" id="action-btn">
      <span id="btn-label">Send Login Code</span>
      <i data-lucide="arrow-right"></i>
    </button>
  </div>

  <script>
    lucide.createIcons();

    // ============ EMAILJS CONFIG ============
    const EMAILJS = {
      publicKey:  'FYOEPCwzLI-g_9c2C',
      serviceId:  'service_91ypu2h',
      templateId: 'template_tpg2dns'
    };
    // ========================================

    const CODE_TTL_MS  = 10 * 60 * 1000; // code valid for 10 minutes
    const MAX_ATTEMPTS = 5;              // wrong guesses allowed
    const RESEND_WAIT  = 30;             // seconds between sends
    const PENDING_KEY  = 'stride_pending_login';

    const $ = id => document.getElementById(id);
    const actionBtn = $('action-btn'), btnLabel = $('btn-label');
    const otpSection = $('otp-section'), otpInput = $('otp');
    const emailInput = $('email');
    const linksRow = $('links'), resendBtn = $('resend-btn'), changeBtn = $('change-btn');
    const statusEl = $('status');

    let mode = 'send';   // 'send' | 'verify'
    let busy = false;
    let cooldownTimer = null;

    if (window.emailjs) {
      emailjs.init({ publicKey: EMAILJS.publicKey });
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }

    function setBusy(state, label) {
      busy = state;
      actionBtn.disabled = state;
      if (label) btnLabel.textContent = label;
    }

    // --- code helpers ---
    function generateCode() {
      const n = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;
      return String(n).padStart(6, '0');
    }

    async function hashCode(email, code) {
      const text = email.toLowerCase() + ':' + code;
      if (window.crypto && crypto.subtle) {
        const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
        return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return text; // fallback on non-secure pages
    }

    const getPending = () => { try { return JSON.parse(sessionStorage.getItem(PENDING_KEY)); } catch { return null; } };
    const savePending = p => sessionStorage.setItem(PENDING_KEY, JSON.stringify(p));
    const clearPending = () => sessionStorage.removeItem(PENDING_KEY);

    // --- UI modes ---
    function setMode(next) {
      mode = next;
      const verifying = next === 'verify';
      otpSection.style.display = verifying ? 'block' : 'none';
      linksRow.style.display = verifying ? 'flex' : 'none';
      emailInput.readOnly = verifying;
      btnLabel.textContent = verifying ? 'Verify & Enter App' : 'Send Login Code';
      if (verifying) {
        otpSection.animate(
          [{ opacity: 0, transform: 'translateY(-10px)' }, { opacity: 1, transform: 'translateY(0)' }],
          { duration: 300, fill: 'forwards' }
        );
      } else {
        otpInput.value = '';
        clearInterval(cooldownTimer);
      }
    }

    function startCooldown(seconds) {
      clearInterval(cooldownTimer);
      let left = seconds;
      const tick = () => {
        if (left > 0) {
          resendBtn.disabled = true;
          resendBtn.textContent = `Resend in ${left}s`;
        } else {
          resendBtn.disabled = false;
          resendBtn.textContent = 'Resend code';
          clearInterval(cooldownTimer);
        }
      };
      tick();
      cooldownTimer = setInterval(() => { left--; tick(); }, 1000);
    }

    // --- send code via EmailJS ---
    async function sendCode() {
      const name = $('name').value.trim();
      const email = emailInput.value.trim();

      if (!name) return setStatus('Please enter your full name.', 'err');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        return setStatus('Please enter a valid email address.', 'err');
      }
      if (!window.emailjs) {
        return setStatus('Could not load the email service. Check your connection.', 'err');
      }

      const wasVerify = mode === 'verify';
      setBusy(true, 'Sending…');
      resendBtn.disabled = true;
      setStatus('');

      const code = generateCode();
      try {
        await emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, {
          email: email,
          passcode: code,
          time: new Date(Date.now() + CODE_TTL_MS)
                  .toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });

        savePending({
          email: email.toLowerCase(),
          hash: await hashCode(email, code),
          expires: Date.now() + CODE_TTL_MS,
          attempts: 0
        });

        setMode('verify');
        setStatus(`Code sent to ${email}. Check your inbox and spam.`, 'ok');
        otpInput.value = '';
        otpInput.focus();
        startCooldown(RESEND_WAIT);
      } catch (err) {
        console.error('EmailJS error:', err);
        const detail = err && err.text ? ` (${err.text})` : '';
        setStatus("Couldn't send the email" + detail + '. Check the address and try again.', 'err');
        if (wasVerify) startCooldown(5);
      } finally {
        setBusy(false, mode === 'verify' ? 'Verify & Enter App' : 'Send Login Code');
      }
    }

    // --- verify code ---
    async function verifyCode() {
      const entered = otpInput.value.trim();
      if (!/^\d{6}$/.test(entered)) return setStatus('Enter the 6-digit code from your email.', 'err');

      const pending = getPending();
      if (!pending) {
        setMode('send');
        return setStatus('Please request a new code.', 'err');
      }
      if (Date.now() > pending.expires) {
        clearPending(); setMode('send');
        return setStatus('That code has expired. Request a new one.', 'err');
      }
      if (pending.attempts >= MAX_ATTEMPTS) {
        clearPending(); setMode('send');
        return setStatus('Too many wrong attempts. Request a new code.', 'err');
      }

      setBusy(true);
      const attemptHash = await hashCode(pending.email, entered);
      setBusy(false);

      if (attemptHash !== pending.hash) {
        pending.attempts += 1;
        savePending(pending);
        const left = MAX_ATTEMPTS - pending.attempts;
        if (left <= 0) {
          clearPending(); setMode('send');
          return setStatus('Too many wrong attempts. Request a new code.', 'err');
        }
        return setStatus(`Wrong code. ${left} ${left === 1 ? 'try' : 'tries'} left.`, 'err');
      }

      // Success
      const user = {
        id: 'STR-' + Math.floor(1000 + Math.random() * 9000),
        name: $('name').value.trim() || 'Student',
        email: pending.email,
        age: $('age').value,
        course: $('course').value,
        phone: $('phone').value,
      };

      clearPending();
      localStorage.setItem('stride_user', JSON.stringify(user));
      localStorage.setItem('stride_last_active', Date.now());
      window.location.href = 'app.html';
    }

    // --- events ---
    actionBtn.addEventListener('click', () => {
      if (busy) return;
      mode === 'send' ? sendCode() : verifyCode();
    });
    resendBtn.addEventListener('click', () => { if (!busy && !resendBtn.disabled) sendCode(); });
    changeBtn.addEventListener('click', () => {
      clearPending();
      setMode('send');
      setStatus('');
      emailInput.focus();
    });
    otpInput.addEventListener('input', () => { otpInput.value = otpInput.value.replace(/\D/g, ''); });
    otpInput.addEventListener('keydown', e => { if (e.key === 'Enter') actionBtn.click(); });

    // Resume if the page was refreshed while a valid code is pending
    (function resume() {
      const p = getPending();
      if (p && Date.now() < p.expires && p.attempts < MAX_ATTEMPTS) {
        emailInput.value = p.email;
        setMode('verify');
        setStatus('Enter the code we emailed you.');
        resendBtn.textContent = 'Resend code';
      } else {
        clearPending();
      }
    })();
  </script>
</body>
</html>
