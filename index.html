  <script>
    // ==========================================
    // CONFIGURATION
    // ==========================================
    const SUPABASE_URL = 'https://kbbrovopcmywahcljudn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ommhdvmUlMnRJmvgCGduFQ_T85Ix9m7';
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const SUPER_ADMIN_EMAIL = 'estdavid10@gmail.com';

    // ---- Single-device login binding (client-side) ----
    const DEVICE_KEY = 'stride_device_id';
    const BOUND_USER_KEY = 'stride_bound_user';
    const BOUND_DEVICE_KEY = 'stride_bound_device';
    function getDeviceId() {
      try {
        let id = localStorage.getItem(DEVICE_KEY);
        if (!id) {
          id = (crypto.randomUUID ? crypto.randomUUID() : 'd-' + Date.now() + '-' + Math.random().toString(36).slice(2));
          localStorage.setItem(DEVICE_KEY, id);
        }
        return id;
      } catch (e) { return 'unknown'; }
    }
    const isSuperAdmin = email => String(email || '').toLowerCase() === SUPER_ADMIN_EMAIL;
    async function enforceDeviceBinding(user, email) {
      if (isSuperAdmin(email)) return true;
      try {
        const { data } = await sb.from('profiles').select('role').eq('id', user.id).single();
        if (data && data.role === 'admin') return true;
      } catch (e) {}
      let bu = null, bd = null;
      try { bu = localStorage.getItem(BOUND_USER_KEY); bd = localStorage.getItem(BOUND_DEVICE_KEY); } catch (e) {}
      if (bu && bu !== user.id && bd === getDeviceId()) return false;
      try { localStorage.setItem(BOUND_USER_KEY, user.id); localStorage.setItem(BOUND_DEVICE_KEY, getDeviceId()); } catch (e) {}
      return true;
    }
    function clearDeviceBinding() {
      try { localStorage.removeItem(BOUND_USER_KEY); localStorage.removeItem(BOUND_DEVICE_KEY); } catch (e) {}
    }
    function showDeviceLock() { $('device-lock').hidden = false; }

    const $ = id => document.getElementById(id);
    const actionBtn = $('action-btn');
    const emailInput = $('email');
    const passwordInput = $('password');
    const statusEl = $('status');

    // device-lock wiring (must run after `$` exists)
    try { $('switch-acct-btn').addEventListener('click', () => { clearDeviceBinding(); $('device-lock').hidden = true; }); } catch (e) {}
    try { if (localStorage.getItem('stride_login_notice')) { localStorage.removeItem('stride_login_notice'); showDeviceLock(); } } catch (e) {}

    let pendingEmail = '';
    let pendingPassword = '';

    // Skip login if already signed in
    async function checkSession() {
      try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) location.replace('app.html');
      } catch (e) { console.error(e); }
    }
    checkSession();

    // Populate schools
    const schools = [
      "University of Lagos (UNILAG)", "University of Ibadan (UI)", "Obafemi Awolowo University (OAU)", "University of Nigeria, Nsukka (UNN)",
      "Ahmadu Bello University (ABU)", "University of Benin (UNIBEN)", "University of Ilorin (UNILORIN)", "Covenant University",
      "Babcock University", "Bowen University", "Federal University of Technology, Akure (FUTA)", "Federal University of Technology, Owerri (FUTO)",
      "Federal University of Technology, Minna (FUTMINNA)", "University of Jos (UNIJOS)", "University of Port Harcourt (UNIPORT)",
      "University of Calabar (UNICAL)", "University of Uyo (UNIUYO)", "University of Abuja (UNIABUJA)", "Nnamdi Azikiwe University (UNIZIK)",
      "Bayero University Kano (BUK)", "University of Maiduguri (UNIMAID)", "Usmanu Danfodiyo University", "Lagos State University (LASU)",
      "Olabisi Onabanjo University (OOU)", "Tai Solarin University of Education (TASUED)", "Ambrose Alli University (AAU)",
      "Delta State University (DELSU)", "Rivers State University (RSU)", "Ekiti State University (EKSU)", "Adekunle Ajasin University (AAUA)",
      "Enugu State University of Science and Technology (ESUT)", "Anambra State University (ANSU)", "Imo State University (IMSU)",
      "Abia State University (ABSU)", "Kaduna State University (KASU)", "Kano University of Science and Technology", "Benue State University (BSU)",
      "Nasarawa State University", "Plateau State University", "Kogi State University", "Kwara State University (KWASU)",
      "Yaba College of Technology (YABATECH)", "Kaduna Polytechnic", "Federal Polytechnic, Ilaro", "Federal Polytechnic, Nekede",
      "Federal Polytechnic, Oko", "Federal Polytechnic, Bida", "Federal Polytechnic, Ede", "The Polytechnic, Ibadan",
      "Lagos State Polytechnic (LASPOTECH)", "Rufus Giwa Polytechnic", "Moshood Abiola Polytechnic", "Auchi Polytechnic",
      "Nigerian Defence Academy (NDA)", "Nigerian Maritime University", "Federal University, Oye-Ekiti", "Federal University, Lokoja",
      "Federal University, Dutse", "Federal University, Ndifu-Alike", "Federal University, Birnin Kebbi", "Federal University, Gusau",
      "Alex Ekwueme Federal University", "Michael Okpara University of Agriculture", "Federal University of Agriculture, Abeokuta (FUNAAB)",
      "Federal University of Agriculture, Makurdi", "Joseph Ayo Babalola University", "Caleb University", "Redeemer's University",
      "Ajayi Crowther University", "Lead City University", "Achievers University", "Afe Babalola University (ABUAD)",
      "Bells University of Technology", "Benson Idahosa University", "Crawford University", "Elizade University",
      "Fountain University", "Godfrey Okoye University", "Igbinedion University", "Landmark University", "Madonna University",
      "McPherson University", "Mountain Top University", "Novena University", "Oduduwa University", "Pan-Atlantic University",
      "Renaissance University", "Salem University", "Samuel Adegboyega University", "Southwestern University", "Veritas University",
      "Wellspring University", "Wesley University", "Western Delta University", "Nile University", "Baze University",
      "African University of Science and Technology", "American University of Nigeria", "Al-Hikmah University", "Al-Qalam University"
    ];
    const schoolSelect = $('school');
    schools.sort().forEach(s => {
      const opt = document.createElement('option');
      opt.value = s; opt.textContent = s;
      schoolSelect.appendChild(opt);
    });

    // ==========================================
    // UI HELPERS
    // ==========================================
    function setStatus(msg, type) {
      statusEl.textContent = msg || '';
      statusEl.className = 'status' + (type ? ' ' + type : '') + (msg ? ' pop' : '');
    }

    function fadeSwapText(el, text) {
      el.textContent = text;
      el.classList.remove('fade-swap');
      void el.offsetWidth;
      el.classList.add('fade-swap');
    }

    // ==========================================
    // BUILT-IN DROPDOWNS
    // ==========================================
    function enhanceSelect(sel) {
      const group = sel.closest('.input-group');
      const btn = document.createElement('div');
      btn.className = 'input-field dd-btn';
      btn.tabIndex = 0;
      btn.setAttribute('role', 'combobox');

      const panel = document.createElement('div');
      panel.className = 'dd-panel';

      const searchable = sel.options.length > 8;
      let search = null;
      if (searchable) {
        search = document.createElement('input');
        search.type = 'text';
        search.className = 'dd-search';
        search.placeholder = 'Search...';
        search.autocomplete = 'off';
        panel.appendChild(search);
      }
      const list = document.createElement('div');
      list.className = 'dd-list';
      panel.appendChild(list);

      sel.insertAdjacentElement('afterend', btn);
      btn.insertAdjacentElement('afterend', panel);

      function label() {
        const o = sel.options[sel.selectedIndex];
        const isPh = !sel.value;
        btn.textContent = o ? o.textContent : '';
        btn.classList.toggle('placeholder', isPh);
      }

      function render(filter) {
        list.innerHTML = '';
        const q = (filter || '').toLowerCase();
        let count = 0;
        Array.from(sel.options).forEach(o => {
          if (o.disabled || o.value === '') return;
          if (q && !o.textContent.toLowerCase().includes(q)) return;
          count++;
          const d = document.createElement('div');
          d.className = 'dd-opt' + (o.value === sel.value ? ' sel' : '');
          d.textContent = o.textContent;
          d.addEventListener('click', () => {
            sel.value = o.value;
            sel.dispatchEvent(new Event('change', { bubbles: true }));
            label();
            close();
          });
          list.appendChild(d);
        });
        if (!count) {
          const e = document.createElement('div');
          e.className = 'dd-empty';
          e.textContent = 'No results';
          list.appendChild(e);
        }
      }

      function open() {
        document.querySelectorAll('.input-group.open').forEach(g => g !== group && g.classList.remove('open'));
        render('');
        if (search) search.value = '';
        group.classList.add('open');
        const cur = list.querySelector('.sel');
        if (cur) list.scrollTop = Math.max(0, cur.offsetTop - 80);
        if (search && window.matchMedia('(hover: hover)').matches) search.focus();
      }
      function close() { group.classList.remove('open'); }

      btn.addEventListener('click', () => group.classList.contains('open') ? close() : open());
      btn.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
        if (e.key === 'Escape') close();
      });
      if (search) search.addEventListener('input', () => render(search.value));
      document.addEventListener('click', e => { if (!group.contains(e.target)) close(); });
      label();
    }
    ['course', 'school', 'target', 'hours'].forEach(id => enhanceSelect($(id)));

    // ==========================================
    // PASSWORD TOGGLES
    // ==========================================
    const EYE_ON  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
    const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.7 5.2A10.9 10.9 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"/><path d="M6.6 6.6A17.5 17.5 0 0 0 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.3-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>';

    document.querySelectorAll('.pw-toggle').forEach(btn => {
      btn.innerHTML = EYE_ON;
      btn.addEventListener('click', () => {
        const input = $(btn.dataset.target);
        if (!input) return;
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        btn.innerHTML = show ? EYE_OFF : EYE_ON;
        btn.classList.toggle('on', show);
        btn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
      });
    });

    // ==========================================
    // STEP 1: BASIC DETAILS -> ONBOARDING
    // ==========================================
    function goToSetup() {
      const email = emailInput.value.trim();
      const pass  = passwordInput.value;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return setStatus('Please enter a valid email address.', 'err');
      if (pass.length < 6) return setStatus('Password must be at least 6 characters.', 'err');

      pendingEmail = email.toLowerCase();
      pendingPassword = pass;
      setStatus('');
      $('view-login').classList.remove('active');
      $('view-onboarding').classList.add('active');
      document.body.classList.add('onboarding');
      fadeSwapText($('main-title'), 'Almost there.');
      fadeSwapText($('main-sub'), 'Tell us about your goals.');
    }

    // ==========================================
    // FINISH & SAVE
    // ==========================================
    function setStatus2(msg, type) {
      const el = $('status-2');
      el.textContent = msg || '';
      el.className = 'status' + (type ? ' ' + type : '') + (msg ? ' pop' : '');
    }

    /* ---- subject combination picker (English + 3) ---- */
    const SUBJ = { picked: new Set(), more: false };
    const courseKeyNow = () => String($('course').value || 'Sciences').toLowerCase();
    function resetSubj() { SUBJ.picked = new Set((window.STRIDE_DEFAULT_COMBO || {})[courseKeyNow()] || ['English']); SUBJ.more = false; drawSubj(); }
    function drawSubj() {
      const box = $('subj-chips'); if (!box) return;
      const g = window.STRIDE_GROUPS || {}; const base = g[courseKeyNow()] || g.sciences || [];
      const list = SUBJ.more ? [...new Set([...base, ...Object.values(g).flat()])] : base;
      box.innerHTML = '';
      list.forEach(n => {
        const b = document.createElement('button'); b.type = 'button';
        b.className = 'sp-chip' + (SUBJ.picked.has(n) ? ' on' : '');
        b.textContent = n;
        b.addEventListener('click', () => {
          if (n === 'English') return;
          if (SUBJ.picked.has(n)) SUBJ.picked.delete(n);
          else if (SUBJ.picked.size >= 4) return setStatus2('You can only pick 4. Remove one first.', 'err');
          else SUBJ.picked.add(n);
          setStatus2(''); drawSubj();
        });
        box.appendChild(b);
      });
      $('subj-count').textContent = SUBJ.picked.size + '/4';
      $('subj-more').style.display = SUBJ.more ? 'none' : '';
    }
    $('subj-more').addEventListener('click', () => { SUBJ.more = true; drawSubj(); });
    $('course').addEventListener('change', resetSubj);
    resetSubj();
    (function () {
      const ob = $('view-onboarding'), st = $('steps'); if (!st) return;
      const upd = () => { const su = $('view-login').classList.contains('active') || ob.classList.contains('active'); st.style.display = su ? 'flex' : 'none'; st.children[1].classList.toggle('on', ob.classList.contains('active')); };
      ['view-onboarding', 'view-login', 'view-signin'].forEach(id => new MutationObserver(upd).observe($(id), { attributes: true, attributeFilter: ['class'] }));
      upd();
    })();
    $('theme-fab').addEventListener('click', () => window.strideTheme && strideTheme.next());

    $('finish-btn').addEventListener('click', async () => {
      const school = $('school').value;
      if (!school) return setStatus2('Please select your school.', 'err');
      if (SUBJ.picked.size !== 4) return setStatus2('Pick exactly 4 subjects (English + 3).', 'err');

      const btn = $('finish-btn');
      const label = $('finish-label');
      const reset = () => { btn.disabled = false; label.textContent = 'Complete Setup'; };

      btn.disabled = true;
      label.textContent = 'Saving...';
      setStatus2('');

      try {
        // Try signing in first (resuming existing account)
        let { data: authData, error: authErr } = await sb.auth.signInWithPassword({
          email: pendingEmail,
          password: pendingPassword
        });

        if (authErr && /invalid login credentials/i.test(authErr.message)) {
          // New account — sign up
          const { data: signUpData, error: signUpErr } = await sb.auth.signUp({
            email: pendingEmail,
            password: pendingPassword,
            options: { data: { course: $('course').value, subjects: [...SUBJ.picked], name: $('name').value.trim() } }
          });

          if (signUpErr) {
            if (/already registered|user already/i.test(signUpErr.message)) {
              setStatus2('That email already has an account. Try signing in instead.', 'err');
            } else {
              setStatus2(signUpErr.message, 'err');
            }
            return reset();
          }

          if (!signUpData.session) {
            setStatus2('Supabase still requires email confirmation. Turn off "Confirm email" in Supabase › Authentication › Providers › Email.', 'err');
            return reset();
          }
          authData = signUpData;
        } else if (authErr) {
          if (/email not confirmed/i.test(authErr.message)) {
            setStatus2('This account was created while email confirmation was on. In Supabase, turn off "Confirm email" (Authentication › Sign In / Providers › Email), then delete this user under Authentication › Users and try again.', 'err');
          } else {
            setStatus2(authErr.message, 'err');
          }
          return reset();
        }

        // Save profile
        const userId = authData.user.id;
        const profilePayload = {
          id: userId,
          name: $('name').value.trim() || pendingEmail.split('@')[0],
          course: $('course').value,
          school: school,
          target_score: parseInt($('target').value, 10),
          study_hours: $('hours').value,
          subjects: [...SUBJ.picked],
          updated_at: new Date().toISOString()
        };


        let { error: dbErr } = await sb.from('profiles').upsert(profilePayload, { onConflict: 'id' });
        if (dbErr && /subjects/i.test(dbErr.message || '')) { const p2 = Object.assign({}, profilePayload); delete p2.subjects; ({ error: dbErr } = await sb.from('profiles').upsert(p2, { onConflict: 'id' })); }
        try { localStorage.setItem('stride_subjects_' + userId, JSON.stringify([...SUBJ.picked])); sb.auth.updateUser({ data: { course: profilePayload.course, subjects: [...SUBJ.picked], name: profilePayload.name } }).then(() => {}, () => {}); } catch (e) {}
        if (dbErr) { setStatus2('Failed to save data: ' + dbErr.message, 'err'); return reset(); }
        if (pendingEmail === SUPER_ADMIN_EMAIL) { try { await sb.rpc('claim_owner'); } catch (e) {} }

        try {
          localStorage.setItem('stride_user', JSON.stringify(authData.user));
          localStorage.setItem('stride_last_active', String(Date.now()));
        } catch (e) {}

        if (!(await enforceDeviceBinding(authData.user, pendingEmail))) {
          await sb.auth.signOut();
          setStatus2('', '');
          showDeviceLock();
          return reset();
        }

        setStatus2('Success! Redirecting...', 'ok');
        setTimeout(() => {
          document.body.style.transition = 'opacity .5s ease';
          document.body.style.opacity = '0';
          setTimeout(() => location.replace('app.html'), 500);
        }, 500);
      } catch (e) {
        console.error(e);
        setStatus2('Something went wrong: ' + (e.message || e), 'err');
        reset();
      }
    });

    $('back-btn').addEventListener('click', () => {
      $('view-onboarding').classList.remove('active');
      $('view-login').classList.add('active');
      document.body.classList.remove('onboarding');
      fadeSwapText($('main-title'), 'Welcome.');
      fadeSwapText($('main-sub'), "Let's get you prepped for JAMB.");
      setStatus2('');
    });

    // ==========================================
    // EVENT LISTENERS (sign up step 1)
    // ==========================================
    actionBtn.addEventListener('click', goToSetup);
    emailInput.addEventListener('keydown', e => { if (e.key === 'Enter') goToSetup(); });
    passwordInput.addEventListener('keydown', e => { if (e.key === 'Enter') goToSetup(); });

    // ==========================================
    // TAB SWITCHING
    // ==========================================
    const tabSignup = $('tab-signup');
    const tabSignin = $('tab-signin');
    const tabThumb  = $('tab-thumb');

    function setMode(mode) {
      const isSignIn = mode === 'signin';

      tabSignup.classList.toggle('active', !isSignIn);
      tabSignin.classList.toggle('active', isSignIn);
      tabSignup.setAttribute('aria-selected', String(!isSignIn));
      tabSignin.setAttribute('aria-selected', String(isSignIn));
      tabThumb.style.transform = isSignIn ? 'translateX(100%)' : 'translateX(0)';

      $('view-login').classList.toggle('active', !isSignIn);
      $('view-signin').classList.toggle('active', isSignIn);

      if (isSignIn) {
        fadeSwapText($('main-title'), 'Welcome back.');
        fadeSwapText($('main-sub'), 'Sign in to pick up where you left off.');
      } else {
        fadeSwapText($('main-title'), 'Welcome.');
        fadeSwapText($('main-sub'), "Let's get you prepped for JAMB.");
      }

      setStatus('');
      setStatusSI('');
    }

    tabSignup.addEventListener('click', () => setMode('signup'));
    tabSignin.addEventListener('click', () => setMode('signin'));

    // ==========================================
    // SIGN IN
    // ==========================================
    const siEmail    = $('si-email');
    const siPass     = $('si-pass');
    const rememberEl = $('remember');
    const statusSI   = $('status-si');

    function setStatusSI(msg, type) {
      statusSI.textContent = msg || '';
      statusSI.className = 'status' + (type ? ' ' + type : '') + (msg ? ' pop' : '');
    }

    const REMEMBER_KEY = 'stride_remember_email';

    (function restoreRemember() {
      try {
        const saved = localStorage.getItem(REMEMBER_KEY);
        if (saved) {
          siEmail.value = saved;
          rememberEl.checked = true;
        }
      } catch (e) { /* storage blocked */ }
    })();

    rememberEl.addEventListener('change', () => {
      if (!rememberEl.checked) {
        try { localStorage.removeItem(REMEMBER_KEY); } catch (e) {}
      }
    });

    async function doSignIn() {
      const email = siEmail.value.trim();
      const pass  = siPass.value;

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        siEmail.focus();
        return setStatusSI('Please enter a valid email address.', 'err');
      }
      if (!pass) {
        siPass.focus();
        return setStatusSI('Please enter your password.', 'err');
      }

      const btn = $('signin-btn');
      const label = $('signin-label');
      btn.disabled = true;
      label.textContent = 'Signing in...';
      setStatusSI('');

      try {
        const { data, error } = await sb.auth.signInWithPassword({
          email: email.toLowerCase(),
          password: pass
        });

        if (error) {
          btn.disabled = false;
          label.textContent = 'Sign in';

          if (/invalid login credentials/i.test(error.message)) {
            setStatusSI('Wrong email or password. New here? Tap Sign up.', 'err');
          } else if (/email not confirmed/i.test(error.message)) {
            setStatusSI('Please confirm your email first — check your inbox.', 'err');
          } else if (/rate limit|too many/i.test(error.message)) {
            setStatusSI('Too many attempts. Please wait a moment.', 'err');
          } else if (/fetch|network/i.test(error.message)) {
            setStatusSI('Network issue — check your connection.', 'err');
          } else {
            setStatusSI(error.message, 'err');
          }
          return;
        }

        try {
          if (rememberEl.checked) localStorage.setItem(REMEMBER_KEY, email.toLowerCase());
          else localStorage.removeItem(REMEMBER_KEY);
          localStorage.setItem('stride_user', JSON.stringify(data.user));
          localStorage.setItem('stride_last_active', String(Date.now()));
        } catch (e) {}

        if (!(await enforceDeviceBinding(data.user, email))) {
          await sb.auth.signOut();
          try { localStorage.removeItem('stride_user'); } catch (e) {}
          btn.disabled = false;
          label.textContent = 'Sign in';
          setStatusSI('');
          return showDeviceLock();
        }

        btn.disabled = false;
        label.textContent = 'Sign in';
        setStatusSI('Welcome back!', 'ok');

        setTimeout(() => {
          document.body.style.transition = 'opacity .5s ease';
          document.body.style.opacity = '0';
          setTimeout(() => location.replace('app.html'), 500);
        }, 400);
      } catch (e) {
        console.error(e);
        btn.disabled = false;
        label.textContent = 'Sign in';
        setStatusSI('Something went wrong: ' + (e.message || e), 'err');
      }
    }

    $('signin-btn').addEventListener('click', doSignIn);
    siEmail.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); doSignIn(); } });
    siPass.addEventListener('keydown',  e => { if (e.key === 'Enter') { e.preventDefault(); doSignIn(); } });
  </script>
</body>
</html>
