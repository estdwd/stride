<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Stride" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Stride | Test</title>
  <script src="theme.js?v=11"></script>

  <script>
    document.documentElement.style.visibility = 'hidden';
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="https://unpkg.com/lucide@0.454.0"></script>

  <link rel="stylesheet" href="test.css?v=11">
  <link rel="stylesheet" href="theme.css?v=11">
  <link rel="stylesheet" href="ui.css?v=11">
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  </script>
</head>
<body>

  <div class="bg" aria-hidden="true"><div class="glow g-blue"></div><div class="glow g-orange"></div><div class="glow g-deep"></div></div>

  <header class="test-header">
    <button class="back-btn" id="back-btn" aria-label="Exit test"><i data-lucide="x"></i></button>
    <div class="progress-wrap">
      <div class="progress-top">
        <span>Question <b id="q-pos">1</b> of <b id="q-total">0</b></span>
        <span id="q-answered">0 answered</span>
      </div>
      <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>
    <div class="timer" id="timer" hidden>--:--</div>
    <button class="back-btn" id="grid-btn" aria-label="Question navigator" hidden><i data-lucide="layout-grid"></i></button>
  </header>

  <main id="main">
    <div class="empty-state" id="loader">
      <div class="em-ic"><i data-lucide="loader-circle"></i></div>
      <h2>Loading questions…</h2>
      <p>Hang on a second.</p>
    </div>
  </main>

  <nav class="nav-bar" id="nav-bar" hidden>
    <button class="nav-btn prev" id="prev-btn" disabled>
      <i data-lucide="chevron-left"></i> Prev
    </button>
    <button class="nav-btn next" id="next-btn">
      Next <i data-lucide="chevron-right"></i>
    </button>
    <button class="nav-btn submit" id="submit-btn" hidden>
      Submit <i data-lucide="check"></i>
    </button>
  </nav>

  <div class="modal" id="modal" hidden>
    <div class="modal-back" data-close></div>
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <p id="modal-body"></p>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-back" id="sheet-back"></div>
    <div class="sheet-card">
      <div class="sheet-head"><h3>Questions</h3><button class="back-btn" id="sheet-x" aria-label="Close"><i data-lucide="x"></i></button></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function () {
    'use strict';

    const SUPABASE_URL = 'https://kbbrovopcmywahcljudn.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_ommhdvmUlMnRJmvgCGduFQ_T85Ix9m7';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const $  = (s, r = document) => r.querySelector(s);
    const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
    const html = document.documentElement;

    let currentUser = null;
    let config = null;
    let questions = [];
    let answers = {};
    let currentIndex = 0;
    let startedAt = null;
    let timerInterval = null;
    let secondsLeft = 0;
    let submitting = false;
    let flags = {};
    let customExp = {};
    let endsAt = 0;
    let questionStart = 0;
    let questionTimes = {};
    const EXP_KEY = 'stride_exp_cache';
    async function loadExplanations(ids) {
      let cache = {}; try { cache = JSON.parse(localStorage.getItem(EXP_KEY) || '{}'); } catch (e) {}
      const out = {}, need = [];
      ids.forEach(i => { if (cache[i]) out[i] = cache[i]; else need.push(i); });
      if (need.length) {
        let rows = null;
        try { const r = await supabase.rpc('question_explanations', { p_ids: need }); if (!r.error) rows = r.data; else console.warn('question_explanations:', r.error.message); } catch (e) { console.warn(e); }
        if (!rows || !rows.length) {
          try { const r = await supabase.from('questions').select('id, explanation').in('id', need); if (!r.error) rows = r.data; else console.warn('questions fallback:', r.error.message); } catch (e) {}
        }
        (rows || []).forEach(r => { if (r && r.explanation) { out[String(r.id)] = r.explanation; cache[String(r.id)] = r.explanation; } });
        try { const ks = Object.keys(cache); if (ks.length > 600) ks.slice(0, ks.length - 600).forEach(k => delete cache[k]); localStorage.setItem(EXP_KEY, JSON.stringify(cache)); } catch (e) {}
        if (!rows) toast('Explanations could not load. Check your connection.');
      }
      return out;
    }
    const RK = 'stride_test_resume';
    const MK = () => 'stride_mistakes_' + (currentUser ? currentUser.id : 'x');
    function getMistakes() { try { return JSON.parse(localStorage.getItem(MK()) || '[]'); } catch (e) { return []; } }
    function setMistakes(a) { try { localStorage.setItem(MK(), JSON.stringify(a.slice(0, 300))); } catch (e) {} }
    function saveProgress() {
      if (!questions.length || submitting || !currentUser || !config || !config.sid) return;
      try { localStorage.setItem(RK, JSON.stringify({ sid: config.sid, uid: currentUser.id, cfg: config, questions, answers, flags, idx: currentIndex, startedAt, endsAt, customExp, ts: Date.now() })); } catch (e) {}
    }
    function clearProgress() { try { localStorage.removeItem(RK); } catch (e) {} }

    const toastEl = $('#toast');
    let toastTimer;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2300);
    }

    const modalEl = $('#modal');
    function openModal(opts) {
      $('#modal-title').textContent = opts.title || '';
      $('#modal-body').textContent = opts.body || '';
      const wrap = $('#modal-actions');
      wrap.innerHTML = '';
      (opts.actions || []).forEach(a => {
        const b = document.createElement('button');
        b.className = 'm-btn ' + (a.style || '');
        b.textContent = a.label;
        b.addEventListener('click', () => { if (a.onClick) a.onClick(); if (a.close !== false) closeModal(); });
        wrap.appendChild(b);
      });
      modalEl.hidden = false;
    }
    function closeModal() { modalEl.hidden = true; }
    modalEl.addEventListener('click', e => { if (e.target.matches('[data-close]')) closeModal(); });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && !modalEl.hidden) closeModal();
      if (modalEl.hidden) {
        if (e.key === 'ArrowRight' && !$('#next-btn').hidden) $('#next-btn').click();
        if (e.key === 'ArrowLeft'  && !$('#prev-btn').disabled) $('#prev-btn').click();
        if (/^[1-4]$/.test(e.key)) {
          const opts = $$('.opt');
          const target = opts[+e.key - 1];
          if (target) target.click();
        }
      }
    });

    function icons() {
      try { if (window.lucide) lucide.createIcons(); } catch (e) {}
    }

    function confirmExit() {
      if (!questions.length || submitting) { location.replace('app.html'); return; }
      openModal({
        title: 'Leave the test?',
        body: 'Your progress is saved. You can resume from your dashboard' + (endsAt ? ' (the timer keeps running).' : '.'),
        actions: [
          { label: 'Stay', style: 'ghost' },
          { label: 'Save & exit', style: 'primary', onClick: () => { saveProgress(); location.replace('app.html'); } },
          { label: 'Discard', style: 'danger', onClick: () => { clearProgress(); try { localStorage.removeItem('stride_test_config'); } catch (e) {} location.replace('app.html'); } }
        ]
      });
    }
    $('#back-btn').addEventListener('click', confirmExit);

    window.addEventListener('pagehide', saveProgress);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveProgress(); });

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m + ':' + String(sec).padStart(2, '0');
    }
    function startTimer(minutes, absEnd) {
      endsAt = absEnd || (Date.now() + minutes * 60000);
      const el = $('#timer');
      el.hidden = false;
      clearInterval(timerInterval);
      const step = () => {
        secondsLeft = Math.round((endsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          el.textContent = '0:00';
          el.className = 'timer danger';
          toast("Time's up — submitting your answers.");
          doSubmit(true);
          return;
        }
        el.textContent = formatTime(secondsLeft);
        el.className = 'timer';
        if (secondsLeft <= 60) el.classList.add('danger');
        else if (secondsLeft <= 300) el.classList.add('warn');
      };
      step();
      if (secondsLeft > 0) timerInterval = setInterval(step, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); }

    // Offline question cache: service worker (in-memory) with a localStorage fallback.
    function swAsk(msg) {
      return new Promise(resolve => {
        try {
          const ctl = navigator.serviceWorker && navigator.serviceWorker.controller;
          if (!ctl) return resolve(null);
          const ch = new MessageChannel();
          const t = setTimeout(() => resolve(null), 800);
          ch.port1.onmessage = e => { clearTimeout(t); resolve(e.data); };
          ctl.postMessage(msg, [ch.port2]);
        } catch (e) { resolve(null); }
      });
    }
    async function cacheGet(key) {
      const r = await swAsk({ type: 'getQuestion', key });
      if (r && r.found) return r.data;
      try { const v = JSON.parse(localStorage.getItem(key) || 'null'); if (v) return v; } catch (e) {}
      return null;
    }
    async function cachePut(key, data) {
      swAsk({ type: 'cacheQuestion', key, data });
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    }

    async function loadQuestions(cfg) {
      if (cfg.retry) {
        const m = getMistakes().filter(x => !cfg.dueOnly || !x.due || x.due <= Date.now()).slice(0, cfg.count || 20);
        return m.map(x => ({ ...x }));
      }
      if (Array.isArray(cfg.custom) && cfg.custom.length) {
        cfg.custom.forEach((c, i) => { if (c.explanation) customExp['n' + i] = c.explanation; });
        return cfg.custom.map(({ answer, explanation, ...q }, i) => ({ id: 'n' + i, subject: cfg.subjects[0], year: null, difficulty: 'medium', section: null, image_url: null, ...q }));
      }
      const cacheKey = 'qs_' + btoa(JSON.stringify({ s: cfg.subjects, y: cfg.year || 'all', c: cfg.count, d: cfg.difficulty || 'medium' }));
      try {
        const { data, error } = await supabase.rpc('pick_questions', {
          p_subjects: cfg.subjects,
          p_year: String(cfg.year || 'all'),
          p_count: cfg.count,
          p_difficulty: cfg.difficulty || 'medium'
        });
        if (error) throw error;
        if (data && data.length) cachePut(cacheKey, data);
        return data || [];
      } catch (e) {
        const hit = await cacheGet(cacheKey);
        if (hit && hit.length) { toast('Offline — using saved questions.'); return hit; }
        if (!navigator.onLine) { const err = new Error('offline'); err.offline = true; throw err; }
        throw e;
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const total = questions.length;
      const answered = Object.keys(answers).length;

      $('#q-pos').textContent = currentIndex + 1;
      $('#q-total').textContent = total;
      $('#q-answered').textContent = answered + ' answered';
      saveProgress();
      $('#progress-fill').style.width = ((currentIndex + 1) / total * 100) + '%';

      const chips = [
        `<span class="q-chip num">Q${currentIndex + 1}</span>`,
        `<span class="q-chip sub">${escapeHtml(q.subject)}</span>`,
        q.year ? `<span class="q-chip">${q.year}</span>` : '',
        q.difficulty ? `<span class="q-chip diff ${q.difficulty}">${q.difficulty}</span>` : '',
        `<button class="q-chip flagbtn ${flags[q.id] ? 'on' : ''}" id="flag-btn"><i data-lucide="flag" style="width:12px;height:12px;vertical-align:-1px"></i> ${flags[q.id] ? 'Flagged' : 'Flag'}</button>`
      ].filter(Boolean).join('');

      questionStart = Date.now();
      const chosen = answers[q.id];
      const opts = ['a', 'b', 'c', 'd'].map(k => {
        const txt = q['option_' + k];
        if (!txt) return '';
        const isChosen = chosen === k;
        return `<button class="opt ${isChosen ? 'chosen' : ''}" data-key="${k}">
          <span class="opt-key">${k}</span>
          <span class="opt-txt">${escapeHtml(txt)}</span>
        </button>`;
      }).join('');

      const img = q.image_url ? `<img src="${escapeAttr(q.image_url)}" alt="Question image" loading="lazy">` : '';

      $('#main').innerHTML = `
        <div class="q-card">
          <div class="q-meta">${chips}</div>
          <p class="q-text">${escapeHtml(q.question)}${img}</p>
        </div>
        <div class="options">${opts}</div>
      `;

      renderMathInElement($('#main'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });

      $$('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!answers[q.id]) questionTimes[q.id] = Math.max(0, Date.now() - (questionStart || Date.now())) / 1000;
          answers[q.id] = btn.dataset.key;
          saveProgress();
          renderQuestion();
        });
      });
      $('#flag-btn').addEventListener('click', () => { if (flags[q.id]) delete flags[q.id]; else flags[q.id] = 1; saveProgress(); renderQuestion(); });

      $('#prev-btn').disabled = currentIndex === 0;
      const isLast = currentIndex === total - 1;
      $('#next-btn').hidden = isLast;
      $('#submit-btn').hidden = !isLast;
      icons();
    }

    function openGrid() {
      const groups = {};
      questions.forEach((q, i) => { const s = q.subject || 'Mixed'; (groups[s] = groups[s] || []).push(i); });
      const fl = Object.keys(flags).length;
      $('#sheet-body').innerHTML = Object.entries(groups).map(([s, idx]) =>
        `<h4>${escapeHtml(s)}</h4><div class="cells">` + idx.map(i => {
          const id = questions[i].id;
          return `<button class="cell ${answers[id] ? 'ans' : ''} ${flags[id] ? 'flag' : ''} ${i === currentIndex ? 'cur' : ''}" data-i="${i}">${i + 1}</button>`;
        }).join('') + '</div>').join('') +
        `<div class="legend"><span>${Object.keys(answers).length} answered</span><span>${questions.length - Object.keys(answers).length} left</span><span>${fl} flagged</span></div>`;
      $('#sheet').hidden = false;
    }
    $('#grid-btn').addEventListener('click', openGrid);
    $('#sheet-x').addEventListener('click', () => { $('#sheet').hidden = true; });
    $('#sheet-back').addEventListener('click', () => { $('#sheet').hidden = true; });
    $('#sheet-body').addEventListener('click', e => {
      const c = e.target.closest('.cell'); if (!c) return;
      currentIndex = +c.dataset.i; $('#sheet').hidden = true; renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function escapeAttr(s) {
      return String(s == null ? '' : s).replace(/"/g, '&quot;');
    }

    $('#prev-btn').addEventListener('click', () => {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    $('#next-btn').addEventListener('click', () => {
      if (currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    });
    $('#submit-btn').addEventListener('click', () => {
      const answered = Object.keys(answers).length;
      const total = questions.length;
      const left = total - answered;
      if (left > 0) {
        openModal({
          title: 'Submit now?',
          body: `You still have ${left} unanswered question${left === 1 ? '' : 's'}${Object.keys(flags).length ? ' and ' + Object.keys(flags).length + ' flagged' : ''}. Unanswered ones will be marked wrong.`,
          actions: [
            { label: 'Keep going', style: 'ghost' },
            { label: 'Submit anyway', style: 'primary', onClick: () => doSubmit(false) }
          ]
        });
      } else {
        doSubmit(false);
      }
    });

    async function doSubmit(auto) {
      if (submitting) return;
      submitting = true;
      stopTimer();

      const total = questions.length;
      const timeTaken = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;

      let graded = [];
      if (config.retry) {
        graded = questions.map(q => ({ id: q.id, is_correct: answers[q.id] === q.correct, correct: q.correct }));
      } else {
        try {
          const payload = {};
          questions.forEach(q => { payload[q.id] = answers[q.id] || null; });
          const { data, error } = await supabase.rpc('submit_test', { p_mode: config.mode, p_answers: payload, p_note: config.noteId || null });
          if (error) throw error;
          graded = data || [];
        } catch (e) {
          console.error(e);
          toast('Could not save your result. Check your connection and submit again.');
          submitting = false;
          if (secondsLeft > 0) startTimer(0, endsAt);
          return;
        }
      }

      try { localStorage.setItem('stride_tests_dirty', '1'); } catch (e) {}
      // explanations (server-side, only fetched after grading)
      const expMap = Object.assign({}, customExp);
      try {
        const ids = questions.map(q => String(q.id)).filter(i => !/^n\d+$/.test(i));
        if (ids.length) Object.assign(expMap, await loadExplanations(ids));
      } catch (e) { console.warn('explanations failed', e); }
      questions.forEach(q => { if (q.exp && !expMap[q.id]) expMap[q.id] = q.exp; });

      let correct = 0;
      const bySubject = {};
      const review = [];
      const byId = {};
      graded.forEach(g => { byId[g.id] = g; });
      questions.forEach(q => {
        const g = byId[q.id] || {};
        const sub = q.subject || 'Mixed';
        if (!bySubject[sub]) bySubject[sub] = { score: 0, total: 0 };
        bySubject[sub].total++;
        const isCorrect = !!g.is_correct;
        if (isCorrect) { correct++; bySubject[sub].score++; }
        review.push({ t: questionTimes[q.id] != null ? questionTimes[q.id] : null, q: q.question, chosen: answers[q.id] || null, correct: g.correct || null, isCorrect, exp: expMap[q.id] || '', subject: sub, flagged: !!flags[q.id] });
      });

      try { localStorage.removeItem('stride_test_config'); } catch (e) {}
      clearProgress();

      // mistake bank: add misses, drop anything now answered correctly
      try {
        let bank = getMistakes();
        const missed = [];
        questions.forEach(q => {
          const g = byId[q.id] || {};
          if (/^n\d+$/.test(String(q.id))) return;
          const prev = bank.find(m => String(m.id) === String(q.id));
          bank = bank.filter(m => String(m.id) !== String(q.id));
          if (!g.is_correct && g.correct) {
            const miss = prev ? (prev.misses || 1) + 1 : 1;
            const days = miss <= 1 ? 1 : miss === 2 ? 3 : 7;
            missed.push({ misses: miss, due: Date.now() + days * 86400000, id: q.id, exp: expMap[q.id] || '', question: q.question, option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d, subject: q.subject, year: q.year, difficulty: q.difficulty, image_url: q.image_url || null, correct: g.correct, exp: expMap[q.id] || '' });
          }
        });
        setMistakes(missed.concat(bank));
      } catch (e) {}

      const streakInfo = config.retry ? null : await countStreak();
      showResult(correct, total, bySubject, timeTaken, review, streakInfo);
    }

    // A day only counts toward the streak once a test is submitted.
    async function countStreak() {
      try {
        const ymd = d => d.toLocaleDateString('en-CA');
        const today = ymd(new Date());
        const y = new Date(); y.setDate(y.getDate() - 1);
        const { data: p } = await supabase.from('profiles').select('streak_count,last_login_date').eq('id', currentUser.id).single();
        if (!p) return null;
        if (p.last_login_date === today) return { n: p.streak_count || 1, isNew: false };
        const n = p.last_login_date === ymd(y) ? (p.streak_count || 0) + 1 : 1;
        const { error } = await supabase.from('profiles').update({ streak_count: n, last_login_date: today }).eq('id', currentUser.id);
        if (error) throw error;
        try { localStorage.setItem('stride_streak_pop', String(n)); } catch (e) {}
        return { n, isNew: true };
      } catch (e) { console.error(e); return null; }
    }

    function showResult(correct, total, bySubject, timeTaken, review, streakInfo) {
      const pct = Math.round((correct / total) * 100);
      const tone = pct >= 75 ? 'good' : pct >= 50 ? 'mid' : '';
      const subjRows = Object.entries(bySubject).map(([subj, s]) => {
        const p = Math.round((s.score / s.total) * 100);
        const t = p >= 75 ? '' : p >= 50 ? 'mid' : 'lo';
        return `<div class="subj-row ${t}">
          <span class="name">${escapeHtml(subj)}</span>
          <span class="score">${s.score}/${s.total}</span>
          <div class="bar"><div style="width:${p}%"></div></div>
        </div>`;
      }).join('');

      $('#nav-bar').hidden = true;
      $('#timer').hidden = true;
      $('#grid-btn').hidden = true;

      const subs = Object.values(bySubject);
      const avgFrac = subs.length ? subs.reduce((a, s) => a + s.score / s.total, 0) / subs.length : 0;
      const jamb = Math.round(avgFrac * 400);
      let target = 0; try { target = +localStorage.getItem('stride_target') || 0; } catch (e) {}
      const gapTxt = target ? (jamb >= target ? `<div class="gap good"><i data-lucide="target" style="width:14px;height:14px;vertical-align:-2px"></i> ${jamb - target} above your target of ${target}</div>` : `<div class="gap bad">${target - jamb} points to your target of ${target}</div>`) : '';
      const jambHtml = config.retry ? '' : `<div class="jamb"><div class="k">${config.mode === 'mock' ? 'JAMB score' : 'Estimated JAMB score'}</div><div class="v"><span id="jamb-n">0</span><small> / 400</small></div>${gapTxt}</div>`;

      $('#main').innerHTML = `
        <div class="result-screen">
          <div class="result-hero">
            <div class="result-pct ${tone}">${pct}%</div>
            <div class="result-sub">${correct} of ${total} correct</div>
            <div class="result-time">Completed in ${formatTime(timeTaken)}</div>
          </div>

          ${jambHtml}
          <div class="percentile" id="percentile" style="text-align:center;color:#97D86E;font-size:.9rem;margin:-4px 0 10px"></div>

          ${streakInfo ? `<div class="streak-banner ${streakInfo.isNew ? 'fresh' : ''}"><span class="fl"><i data-lucide="flame" style="width:1.9rem;height:1.9rem;color:#EB7650"></i></span><div><b>${streakInfo.n}-day streak</b><small>${streakInfo.isNew ? 'Streak extended — nice work!' : 'Already counted today. Keep going!'}</small></div></div>` : ''}

          ${subjRows ? `<div class="result-breakdown"><h3>By subject</h3>${subjRows}</div>` : ''}

          <div class="result-actions">
            <button class="nav-btn next" id="review-btn">
              <i data-lucide="list-checks"></i> Review answers
            </button>
            <button class="nav-btn next" id="share-btn">Share <i data-lucide="share-2"></i></button>
            ${getMistakes().length && !config.retry ? `<button class="nav-btn prev" id="retry-btn"><i data-lucide="rotate-ccw"></i> Retry missed (${getMistakes().length})</button>` : ''}
            <button class="nav-btn prev" id="home-btn">
              <i data-lucide="home"></i> Back to app
            </button>
          </div>
        </div>
      `;
      icons();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      $('#review-btn').addEventListener('click', () => showReview(review));
      const rb = $('#retry-btn');
      if (rb) rb.addEventListener('click', () => {
        try { localStorage.setItem('stride_test_config', JSON.stringify({ retry: true, mode: 'practice', subjects: ['Mistakes'], year: 'all', count: 20, sid: 'r' + Date.now() })); } catch (e) {}
        location.replace('test.html');
      });
      const countUp = (el, to, ms) => { if (!el) return; const t0 = performance.now(); const f = n => { const k = Math.min(1, (n - t0) / ms); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); };
      countUp($('#jamb-n'), jamb, 1100);
      $('#home-btn').addEventListener('click', () => location.replace('app.html'));

      // history
      try { localStorage.setItem('stride_result_' + Date.now(), JSON.stringify({ pct, jamb, total, correct, date: new Date().toISOString(), mode: config.mode })); } catch (e) {}

      // share
      $('#share-btn').addEventListener('click', async () => {
        const text = `I scored ${pct}% (${correct}/${total}) on Stride. Estimated JAMB: ${jamb}/400.`;
        const url = location.origin + location.pathname.replace(/[^/]*$/, '');
        if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
        try { await navigator.clipboard.writeText(text + ' ' + url); toast('Copied to clipboard'); }
        catch (e) { window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank'); }
      });

      // percentile (leaderboard returns top 10 only, so show rank when the user is on it)
      if (!config.retry) {
        supabase.rpc('leaderboard_v2', { p_days: 0, p_subject: null, p_course: null }).then(({ data }) => {
          const rows = data || [];
          const i = rows.findIndex(r => r.id === currentUser.id);
          const el = $('#percentile');
          if (el && i >= 0) el.textContent = `You're #${i + 1} on the all-time leaderboard`;
        }).catch(() => {});
      }
    }

    function showReview(review, only) {
      const ts = review.map(r => r.t).filter(t => t != null);
      const avgT = ts.length ? ts.reduce((a, b) => a + b, 0) / ts.length : null;
      const list = review.map((r, i) => ({ r, i })).filter(x => !only || !x.r.isCorrect);
      const items = list.map(({ r, i }, n) => {
        const rowClass = r.isCorrect ? 'correct' : 'wrong';
        const yourTxt = r.chosen
          ? `${r.chosen.toUpperCase()} — ${escapeHtml(questions[i]['option_' + r.chosen] || '')}`
          : 'Not answered';
        const correctTxt = r.correct ? `${r.correct.toUpperCase()} — ${escapeHtml(questions[i]['option_' + r.correct] || '')}` : '—';
        return `<div class="review-item ${rowClass}" style="animation-delay:${Math.min(n, 12) * 40}ms">
          <div class="review-q"><b style="color:var(--muted);font-weight:400">Q${i + 1}.</b> ${escapeHtml(r.q)}${r.flagged ? ' <i data-lucide="flag" style="width:13px;height:13px;color:#F8CB4A;vertical-align:-2px"></i>' : ''}${r.t != null && r.t < 5 ? ' <span style="color:#F8CB4A;font-size:.75rem">rushed</span>' : ''}</div>
          <div class="review-ans">
            <div class="row"><span class="lbl">Your answer</span><span class="val ${r.isCorrect ? 'good' : 'bad'}">${yourTxt}</span></div>
            ${!r.isCorrect ? `<div class="row"><span class="lbl">Correct</span><span class="val good">${correctTxt}</span></div>` : ''}
          </div>
          ${r.exp ? `<div class="review-exp"><b>Explanation</b>${escapeHtml(r.exp)}</div>` : ''}
        </div>`;
      }).join('') || '<p style="color:var(--muted);text-align:center;padding:30px 0">Nothing wrong here.</p>';

      $('#main').innerHTML = `
        <div class="result-screen">
          <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h1 style="font-size:1.6rem;font-weight:400;letter-spacing:-0.03em">Review</h1>
            <button class="back-btn" id="review-back" aria-label="Back to result"><i data-lucide="arrow-left"></i></button>
          </header>
          ${avgT != null ? `<div style="color:var(--muted);font-size:.85rem;margin-bottom:10px">Avg time per question: ${avgT.toFixed(1)}s</div>` : ''}
          <div class="rv-tabs"><button data-f="all" class="${only ? '' : 'on'}">All</button><button data-f="wrong" class="${only ? 'on' : ''}">Wrong only</button></div>
          <div class="review-list">${items}</div>
        </div>
      `;
      icons();
      renderMathInElement($('#main'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      $('#review-back').addEventListener('click', () => location.replace('app.html'));
      $$('.rv-tabs button').forEach(b => b.addEventListener('click', () => showReview(review, b.dataset.f === 'wrong')));
    }

    function showEmpty(title, msg) {
      $('#nav-bar').hidden = true;
      $('#main').innerHTML = `
        <div class="empty-state">
          <div class="em-ic"><i data-lucide="book-x"></i></div>
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(msg)}</p>
          <button class="nav-btn next" onclick="location.replace('app.html')">
            <i data-lucide="arrow-left"></i> Back to practice
          </button>
        </div>
      `;
      icons();
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { html.style.visibility = 'hidden'; return location.replace('index.html'); }
      currentUser = session.user;
      try {
        const bu = localStorage.getItem('stride_bound_user');
        if (bu && bu !== currentUser.id && localStorage.getItem('stride_bound_device') === localStorage.getItem('stride_device_id') && (currentUser.email || '').toLowerCase() !== 'estdavid10@gmail.com') {
          const { data: pr } = await supabase.from('profiles').select('role').eq('id', currentUser.id).single();
          if (!pr || pr.role !== 'admin') { try { localStorage.setItem('stride_login_notice', 'Device bound to another account'); } catch (e) {} await supabase.auth.signOut(); return location.replace('index.html'); }
        }
      } catch (e) {}

      let raw = null;
      try { raw = localStorage.getItem('stride_test_config'); } catch (e) {}
      if (!raw) { return location.replace('app.html'); }
      try { config = JSON.parse(raw); } catch (e) { return location.replace('app.html'); }
      if (!config || !config.subjects || !config.subjects.length || !config.count) {
        return location.replace('app.html');
      }

      let resumed = null;
      try {
        const r = JSON.parse(localStorage.getItem(RK) || 'null');
        if (r && r.uid === currentUser.id && r.sid && r.sid === config.sid && Date.now() - r.ts < 864e5) resumed = r;
        else if (r) localStorage.removeItem(RK);
      } catch (e) {}
      if (!config.sid) config.sid = 's' + Date.now();
      try { localStorage.setItem('stride_test_config', JSON.stringify(config)); } catch (e) {}

      let loaded = [];
      try {
        loaded = resumed ? resumed.questions : await loadQuestions(config);
      } catch (e) {
        console.error(e);
        html.style.visibility = 'visible';
        return showEmpty('Could not load questions', 'There was a problem reaching the database. Please try again from the Practice screen.');
      }

      if (!loaded.length) {
        html.style.visibility = 'visible';
        return showEmpty(
          'No questions yet',
          `There are no questions for ${config.subjects.join(', ')} ${config.year !== 'all' ? 'in ' + config.year : ''}. Add some in your Supabase questions table, or try a different subject or year.`
        );
      }

      questions = loaded;
      startedAt = Date.now();
      if (resumed) {
        answers = resumed.answers || {}; flags = resumed.flags || {}; customExp = resumed.customExp || {};
        currentIndex = Math.min(resumed.idx || 0, questions.length - 1); startedAt = resumed.startedAt || startedAt;
      }

      html.style.visibility = 'visible';
      $('#nav-bar').hidden = false;
      $('#grid-btn').hidden = false;
      renderQuestion();
      if (resumed) toast('Welcome back — your progress was restored.');

      if (config.mode === 'timed') {
        if (config.time && config.time > 0) startTimer(config.time, resumed && resumed.endsAt);
      } else if (config.mode === 'mock') {
        startTimer(config.time || 120, resumed && resumed.endsAt);
      }
      saveProgress();
      icons();
    }

    init();
  })();
  </script>
</body>
</html>
