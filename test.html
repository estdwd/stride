<!DOCTYPE html>
<html lang="en">
<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --logo: #C9500F; --bg: #020305; --ink: #0b0b0b; --muted: #9a9a9a;
      --line: rgba(255, 255, 255, 0.16); --surface: rgba(16, 16, 16, 0.86); --surface-2: rgba(0, 0, 0, 0.55);
      --orange: #EB7650; --yellow: #F8CB4A; --green: #97D86E; --blue: #8DB9EA; --red: #E8615A;
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    html { background: var(--bg); }
    body { background: transparent; color: #fff; min-height: 100vh; padding: 22px 18px 130px; max-width: 560px; margin: 0 auto; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
    button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 12px; }
    svg { width: 20px; height: 20px; }

    .bg { position: fixed; inset: 0; z-index: -1; background: #020305; overflow: hidden; }
    .glow { position: absolute; border-radius: 50%; pointer-events: none; }
    .g-blue { width: 640px; height: 520px; left: -300px; top: -160px; background: radial-gradient(closest-side, rgba(24,120,170,0.55), rgba(10,60,95,0.22) 55%, rgba(0,0,0,0) 78%); }
    .g-orange { width: 560px; height: 560px; right: -320px; top: 18%; background: radial-gradient(closest-side, rgba(255,110,30,0.5), rgba(190,60,10,0.18) 58%, rgba(0,0,0,0) 80%); }
    .g-deep { width: 620px; height: 620px; left: -220px; bottom: -320px; background: radial-gradient(closest-side, rgba(255,105,28,0.42), rgba(160,50,8,0.14) 58%, rgba(0,0,0,0) 80%); }
    .bg::before { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,0.62) 100%), rgba(0,0,0,0.32); }
    .bg::after { content: ""; position: absolute; inset: 0; background-image: radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0) 1px, rgba(0,0,0,0.8) 1.7px); background-size: 5px 5px; }

    .test-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .back-btn { width: 44px; height: 44px; border-radius: 50%; background: rgba(22,22,22,0.92); border: 1px solid rgba(255,255,255,0.08); display: grid; place-items: center; flex-shrink: 0; transition: transform .18s ease; }
    .back-btn:active { transform: scale(.9); }
    .progress-wrap { flex: 1; min-width: 0; }
    .progress-top { display: flex; justify-content: space-between; font-size: .8rem; color: var(--muted); margin-bottom: 7px; }
    .progress-top b { color: #fff; font-weight: 500; font-variant-numeric: tabular-nums; }
    .progress-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .progress-bar > div { height: 100%; width: 0; background: var(--orange); border-radius: 3px; transition: width .4s var(--ease); }
    .timer { padding: 8px 14px; border-radius: 999px; background: rgba(22,22,22,0.92); border: 1px solid rgba(255,255,255,0.08); font-size: .9rem; font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink: 0; min-width: 78px; text-align: center; }
    .timer[hidden] { display: none; }
    .timer.warn { color: var(--yellow); border-color: rgba(248,203,74,0.4); }
    .timer.danger { color: var(--red); border-color: rgba(232,97,90,0.4); animation: pulse .8s ease-in-out infinite alternate; }
    @keyframes pulse { from { opacity: .7; } to { opacity: 1; } }

    .q-card { background: var(--surface); border: 1px solid rgba(255,255,255,0.07); border-radius: 30px; padding: 26px 22px; margin-bottom: 14px; animation: rise .4s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .q-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .q-chip { font-size: .7rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; background: rgba(255,255,255,0.07); color: var(--muted); }
    .q-chip.num { background: rgba(235,118,80,0.15); color: var(--orange); }
    .q-chip.sub { background: rgba(141,185,234,0.15); color: var(--blue); }
    .q-chip.diff.easy   { background: rgba(151,216,110,0.15); color: var(--green); }
    .q-chip.diff.medium { background: rgba(248,203,74,0.15); color: var(--yellow); }
    .q-chip.diff.hard   { background: rgba(232,97,90,0.15); color: var(--red); }
    .q-text { font-size: 1.12rem; line-height: 1.5; font-weight: 400; color: #fff; word-break: break-word; }
    .q-text img { display: block; max-width: 100%; border-radius: 14px; margin-top: 14px; }

    .options { display: flex; flex-direction: column; gap: 10px; }
    .opt {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px 18px; text-align: left;
      border-radius: 22px;
      background: var(--surface); border: 1px solid rgba(255,255,255,0.08);
      transition: transform .25s var(--ease), background .2s, border-color .2s;
    }
    .opt:active { transform: scale(.98); }
    .opt-key {
      width: 30px; height: 30px; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center;
      border: 1.5px solid rgba(255,255,255,0.22);
      font-size: .82rem; font-weight: 600; text-transform: uppercase;
      transition: background .2s, border-color .2s, color .2s;
    }
    .opt-txt { flex: 1; font-size: 1rem; line-height: 1.45; color: #e9e9e9; padding-top: 4px; }
    .opt.chosen { border-color: var(--orange); background: rgba(235,118,80,0.1); }
    .opt.chosen .opt-key { background: var(--orange); border-color: var(--orange); color: #1a0d06; }
    .opt.chosen .opt-txt { color: #fff; }

    .nav-bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 18px calc(16px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, rgba(0,0,0,0.94) 40%, rgba(0,0,0,0)); display: flex; gap: 10px; max-width: 560px; margin: 0 auto; z-index: 50; }
    .nav-btn { flex: 1; padding: 17px; border-radius: 999px; font-size: 1rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; transition: transform .25s var(--ease), opacity .2s; }
    .nav-btn:active { transform: scale(.97); }
    .nav-btn:disabled { opacity: .35; pointer-events: none; }
    .nav-btn svg { width: 19px; height: 19px; }
    .nav-btn.prev { background: rgba(255,255,255,0.08); color: #fff; }
    .nav-btn.next { background: var(--orange); color: #1a0d06; }
    .nav-btn.submit { background: var(--green); color: #0f2e0c; }

    .empty-state { text-align: center; padding: 60px 24px; }
    .empty-state .em-ic { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,0.06); display: grid; place-items: center; margin: 0 auto 18px; color: var(--muted); }
    .empty-state .em-ic svg { width: 32px; height: 32px; }
    .empty-state h2 { font-size: 1.4rem; font-weight: 500; margin-bottom: 8px; letter-spacing: -0.02em; }
    .empty-state p { color: var(--muted); font-size: .94rem; line-height: 1.55; max-width: 34ch; margin: 0 auto 24px; }
    .empty-state .nav-btn { display: inline-flex; max-width: 240px; margin: 0 auto; }

    .result-screen { animation: rise .5s var(--ease) both; }
    .result-hero { text-align: center; padding: 40px 20px 30px; background: var(--surface); border: 1px solid rgba(255,255,255,0.07); border-radius: 30px; margin-bottom: 14px; }
    .result-pct { font-size: clamp(4rem, 20vw, 5.5rem); font-weight: 600; letter-spacing: -0.06em; line-height: 1; color: var(--orange); font-variant-numeric: tabular-nums; }
    .result-pct.good { color: var(--green); }
    .result-pct.mid  { color: var(--yellow); }
    .result-sub { color: var(--muted); font-size: 1rem; margin-top: 8px; }
    .result-time { font-size: .82rem; color: #666; margin-top: 6px; }

    .result-breakdown { background: var(--surface); border: 1px solid rgba(255,255,255,0.07); border-radius: 26px; padding: 20px 22px; margin-bottom: 14px; }
    .result-breakdown h3 { font-size: 1rem; font-weight: 500; margin-bottom: 16px; letter-spacing: -0.01em; }
    .subj-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .subj-row:last-child { border-bottom: 0; padding-bottom: 0; }
    .subj-row:first-child { padding-top: 0; }
    .subj-row .name { flex: 1; font-size: .94rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .subj-row .score { font-size: .84rem; color: var(--muted); font-variant-numeric: tabular-nums; }
    .subj-row .bar { width: 60px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; flex-shrink: 0; }
    .subj-row .bar > div { height: 100%; border-radius: 3px; background: var(--green); transition: width .9s var(--ease); }
    .subj-row.mid .bar > div { background: var(--yellow); }
    .subj-row.lo  .bar > div { background: var(--red); }

    .result-actions { display: flex; flex-direction: column; gap: 10px; }
    .result-actions .nav-btn { width: 100%; }

    .review-list { display: flex; flex-direction: column; gap: 10px; }
    .review-item { padding: 18px 20px; background: var(--surface); border: 1px solid rgba(255,255,255,0.07); border-radius: 22px; }
    .review-item.correct { border-color: rgba(151,216,110,0.25); }
    .review-item.wrong   { border-color: rgba(232,97,90,0.25); }
    .review-q { font-size: .95rem; line-height: 1.45; margin-bottom: 12px; color: #e9e9e9; }
    .review-ans { display: flex; flex-direction: column; gap: 6px; font-size: .84rem; }
    .review-ans .row { display: flex; gap: 8px; align-items: center; }
    .review-ans .lbl { color: var(--muted); min-width: 70px; }
    .review-ans .val { font-weight: 500; }
    .review-ans .val.good { color: var(--green); }
    .review-ans .val.bad  { color: var(--red); }

    .toast { position: fixed; left: 50%; bottom: 118px; transform: translate(-50%, 20px); background: #fff; color: #000; padding: 13px 22px; border-radius: 999px; font-size: .9rem; font-weight: 500; z-index: 600; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .3s var(--ease); max-width: calc(100vw - 40px); text-align: center; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    .modal { position: fixed; inset: 0; z-index: 500; display: grid; place-items: end center; }
    .modal[hidden] { display: none; }
    .modal-back { position: absolute; inset: 0; background: rgba(0,0,0,0.72); animation: fadeIn .2s ease; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-card { position: relative; width: 100%; max-width: 560px; background: #141414; border: 1px solid rgba(255,255,255,0.09); border-radius: 30px 30px 0 0; padding: 28px 22px calc(28px + env(safe-area-inset-bottom, 0px)); animation: sheetUp .32s var(--ease); }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-card h3 { font-size: 1.24rem; font-weight: 500; margin-bottom: 10px; }
    .modal-card p { font-size: .92rem; color: #b4b4b4; line-height: 1.55; }
    .modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 24px; }
    .m-btn { width: 100%; padding: 16px; border-radius: 999px; font-size: .98rem; font-weight: 500; background: rgba(255,255,255,0.08); transition: transform .14s ease; }
    .m-btn:active { transform: scale(.98); }
    .m-btn.primary { background: #fff; color: #000; }
    .m-btn.danger  { background: rgba(232,97,90,0.14); color: var(--red); border: 1px solid rgba(232,97,90,0.3); }
    .m-btn.ghost   { background: transparent; color: var(--muted); }

    @media (hover: hover) and (pointer: fine) {
      .opt:hover { border-color: rgba(255,255,255,0.25); transform: translateY(-1px); }
      .back-btn:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.28); }
      .nav-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 12px 26px -10px rgba(235,118,80,0.5); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
    @media (max-width: 360px) {
      .q-text { font-size: 1.02rem; }
      .opt-txt { font-size: .94rem; }
    }
  
    .streak-banner { display: flex; align-items: center; gap: 14px; margin: 0 0 18px; padding: 14px 18px; border-radius: 18px; background: rgba(255,176,32,.12); border: 1px solid rgba(255,176,32,.35); }
    .streak-banner .fl { font-size: 1.9rem; display: inline-block; transform-origin: 50% 85%; }
    .streak-banner b { display: block; font-size: 1.05rem; font-weight: 600; }
    .streak-banner small { color: #cbd5e1; font-size: .8rem; }
    .streak-banner.fresh { animation: bannerGlow 1.8s ease-out both; }
    .streak-banner.fresh .fl { animation: flameBurst 1s cubic-bezier(.2,.9,.3,1.4) .2s both; }
    @keyframes bannerGlow { 0% { opacity: 0; transform: translateY(14px) scale(.96); } 30% { opacity: 1; transform: none; box-shadow: 0 0 0 0 rgba(255,176,32,.7); } 100% { box-shadow: 0 0 34px 6px rgba(255,176,32,.0); } }
    @keyframes flameBurst { 0% { transform: scale(.2) rotate(-20deg); } 60% { transform: scale(1.5) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
  
    /* ---- v2 additions ---- */
    .opt { transition: transform .18s var(--ease, ease), border-color .2s, background .2s; }
    .opt:active { transform: scale(.98); }
    .opt.chosen { animation: optPop .28s ease; }
    @keyframes optPop { 50% { transform: scale(1.025); } }
    .q-card { animation: riseIn .45s cubic-bezier(.16,1,.3,1) both; }
    @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .flagbtn { font: inherit; cursor: pointer; border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--muted,#9a9a9a); margin-left: auto; }
    .flagbtn.on { color: #F8CB4A; border-color: rgba(248,203,74,.5); background: rgba(248,203,74,.1); }
    .sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
    .sheet[hidden] { display: none; }

    .sheet-head h3 { font-weight: 500; letter-spacing: -.02em; }
    .sheet h4 { font-weight: 400; font-size: .8rem; color: #9a9a9a; margin: 14px 0 8px; text-transform: uppercase; letter-spacing: .06em; }
    .cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 8px; }
    .cell { height: 44px; border-radius: 14px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: #fff; font: inherit; cursor: pointer; transition: transform .15s; }
    .cell:active { transform: scale(.92); }
    .cell.ans { background: rgba(141,185,234,.2); border-color: rgba(141,185,234,.5); }
    .cell.flag { background: rgba(248,203,74,.18); border-color: #F8CB4A; color: #F8CB4A; }
    .cell.cur { outline: 2px solid #EB7650; outline-offset: 2px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .75rem; color: #9a9a9a; margin-top: 16px; }
    .jamb { margin: 14px 0; padding: 18px 20px; border-radius: 26px; background: linear-gradient(135deg, rgba(235,118,80,.18), rgba(141,185,234,.12)); border: 1px solid rgba(255,255,255,.1); animation: riseIn .6s .15s cubic-bezier(.16,1,.3,1) both; }
    .jamb .k { font-size: .78rem; color: #9a9a9a; }

    .subj-row .bar > div { animation: growBar .9s cubic-bezier(.16,1,.3,1) both; transform-origin: left; }

    .review-item { animation: riseIn .45s cubic-bezier(.16,1,.3,1) both; }

    .review-exp b { display: block; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: #8DB9EA; margin-bottom: 4px; font-weight: 500; }
    .rv-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .rv-tabs button { font: inherit; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: transparent; color: #9a9a9a; cursor: pointer; }

    @media (prefers-reduced-motion: reduce) { .q-card, .jamb, .review-item, .sheet-card, .opt.chosen, .subj-row .bar > div { animation: none !important; } }
  </style>

  </script>

  <header class="test-header">
    <button class="back-btn" id="back-btn" aria-label="Exit test"><i data-lucide="x"></i></button>

    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = s % 60;
      return m + ':' + String(sec).padStart(2, '0');
    }
    function startTimer(minutes, absEnd) {
      endsAt = absEnd || (Date.now() + minutes * 60000);
      const el = $('#timer');
      el.hidden = false;
      clearInterval(timerInterval);
      const step = () => {
        secondsLeft = Math.round((endsAt - Date.now()) / 1000);
        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          el.textContent = '0:00';
          el.className = 'timer danger';
          toast("Time's up — submitting your answers.");
          doSubmit(true);
          return;
        }
        el.textContent = formatTime(secondsLeft);
        el.className = 'timer';
        if (secondsLeft <= 60) el.classList.add('danger');
        else if (secondsLeft <= 300) el.classList.add('warn');
      };
      step();
      if (secondsLeft > 0) timerInterval = setInterval(step, 1000);
    }
    function stopTimer() { clearInterval(timerInterval); }

    // Offline question cache: service worker (in-memory) with a localStorage fallback.
    function swAsk(msg) {
      return new Promise(resolve => {
        try {
          const ctl = navigator.serviceWorker && navigator.serviceWorker.controller;
          if (!ctl) return resolve(null);
          const ch = new MessageChannel();
          const t = setTimeout(() => resolve(null), 800);
          ch.port1.onmessage = e => { clearTimeout(t); resolve(e.data); };
          ctl.postMessage(msg, [ch.port2]);
        } catch (e) { resolve(null); }
      });
    }
    async function cacheGet(key) {
      const r = await swAsk({ type: 'getQuestion', key });
      if (r && r.found) return r.data;
      try { const v = JSON.parse(localStorage.getItem(key) || 'null'); if (v) return v; } catch (e) {}
      return null;
    }
    async function cachePut(key, data) {
      swAsk({ type: 'cacheQuestion', key, data });
      try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) {}
    }

    async function loadQuestions(cfg) {
      if (cfg.retry) {
        const m = getMistakes().filter(x => !cfg.dueOnly || !x.due || x.due <= Date.now()).slice(0, cfg.count || 20);
        return m.map(x => ({ ...x }));
      }
      if (Array.isArray(cfg.custom) && cfg.custom.length) {
        cfg.custom.forEach((c, i) => { if (c.explanation) customExp['n' + i] = c.explanation; });
        return cfg.custom.map(({ answer, explanation, ...q }, i) => ({ id: 'n' + i, subject: cfg.subjects[0], year: null, difficulty: 'medium', section: null, image_url: null, ...q }));
      }
      const cacheKey = 'qs_' + btoa(JSON.stringify({ s: cfg.subjects, y: cfg.year || 'all', c: cfg.count, d: cfg.difficulty || 'medium' }));
      try {
        const { data, error } = await supabase.rpc('pick_questions', {
          p_subjects: cfg.subjects,
          p_year: String(cfg.year || 'all'),
          p_count: cfg.count,
          p_difficulty: cfg.difficulty || 'medium'
        });
        if (error) throw error;
        if (data && data.length) cachePut(cacheKey, data);
        return data || [];
      } catch (e) {
        const hit = await cacheGet(cacheKey);
        if (hit && hit.length) { toast('Offline — using saved questions.'); return hit; }
        if (!navigator.onLine) { const err = new Error('offline'); err.offline = true; throw err; }
        throw e;
      }
    }

    function renderQuestion() {
      const q = questions[currentIndex];
      const total = questions.length;
      const answered = Object.keys(answers).length;

      $('#q-pos').textContent = currentIndex + 1;
      $('#q-total').textContent = total;
      $('#q-answered').textContent = answered + ' answered';
      saveProgress();
      $('#progress-fill').style.width = ((currentIndex + 1) / total * 100) + '%';

      const chips = [
        `<span class="q-chip num">Q${currentIndex + 1}</span>`,
        `<span class="q-chip sub">${escapeHtml(q.subject)}</span>`,
        q.year ? `<span class="q-chip">${q.year}</span>` : '',
        q.difficulty ? `<span class="q-chip diff ${q.difficulty}">${q.difficulty}</span>` : '',
        `<button class="q-chip flagbtn ${flags[q.id] ? 'on' : ''}" id="flag-btn"><i data-lucide="flag" style="width:12px;height:12px;vertical-align:-1px"></i> ${flags[q.id] ? 'Flagged' : 'Flag'}</button>`
      ].filter(Boolean).join('');

      questionStart = Date.now();
      const chosen = answers[q.id];
      const opts = ['a', 'b', 'c', 'd'].map(k => {
        const txt = q['option_' + k];
        if (!txt) return '';
        const isChosen = chosen === k;
        return `<button class="opt ${isChosen ? 'chosen' : ''}" data-key="${k}">
          <span class="opt-key">${k}</span>
          <span class="opt-txt">${escapeHtml(txt)}</span>
        </button>`;
      }).join('');

      const img = q.image_url ? `<img src="${escapeAttr(q.image_url)}" alt="Question image" loading="lazy">` : '';

      $('#main').innerHTML = `
        <div class="q-card">
          <div class="q-meta">${chips}</div>
          <p class="q-text">${escapeHtml(q.question)}${img}</p>
        </div>
        <div class="options">${opts}</div>
      `;

      renderMathInElement($('#main'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });

      $$('.opt').forEach(btn => {
        btn.addEventListener('click', () => {
          if (!answers[q.id]) questionTimes[q.id] = Math.max(0, Date.now() - (questionStart || Date.now())) / 1000;
          answers[q.id] = btn.dataset.key;
          saveProgress();
          renderQuestion();
        });
      });
      $('#flag-btn').addEventListener('click', () => { if (flags[q.id]) delete flags[q.id]; else flags[q.id] = 1; saveProgress(); renderQuestion(); });

      $('#prev-btn').disabled = currentIndex === 0;
      const isLast = currentIndex === total - 1;
      $('#next-btn').hidden = isLast;
      $('#submit-btn').hidden = !isLast;
      icons();
    }

    function openGrid() {
      const groups = {};
      questions.forEach((q, i) => { const s = q.subject || 'Mixed'; (groups[s] = groups[s] || []).push(i); });
      const fl = Object.keys(flags).length;
      $('#sheet-body').innerHTML = Object.entries(groups).map(([s, idx]) =>
        `<h4>${escapeHtml(s)}</h4><div class="cells">` + idx.map(i => {
          const id = questions[i].id;
          return `<button class="cell ${answers[id] ? 'ans' : ''} ${flags[id] ? 'flag' : ''} ${i === currentIndex ? 'cur' : ''}" data-i="${i}">${i + 1}</button>`;
        }).join('') + '</div>').join('') +
        `<div class="legend"><span>${Object.keys(answers).length} answered</span><span>${questions.length - Object.keys(answers).length} left</span><span>${fl} flagged</span></div>`;
      $('#sheet').hidden = false;
    }
    $('#grid-btn').addEventListener('click', openGrid);
    $('#sheet-x').addEventListener('click', () => { $('#sheet').hidden = true; });
    $('#sheet-back').addEventListener('click', () => { $('#sheet').hidden = true; });
    $('#sheet-body').addEventListener('click', e => {
      const c = e.target.closest('.cell'); if (!c) return;
      currentIndex = +c.dataset.i; $('#sheet').hidden = true; renderQuestion(); window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
    function escapeAttr(s) {
      return String(s == null ? '' : s).replace(/"/g, '&quot;');
    }

    $('#prev-btn').addEventListener('click', () => {

    $('#submit-btn').addEventListener('click', () => {

        openModal({

          body: `You still have ${left} unanswered question${left === 1 ? '' : 's'}${Object.keys(flags).length ? ' and ' + Object.keys(flags).length + ' flagged' : ''}. Unanswered ones will be marked wrong.`,
          actions: [

        doSubmit(false);

    async function doSubmit(auto) {
      if (submitting) return;
      submitting = true;
      stopTimer();

      const total = questions.length;
      const timeTaken = startedAt ? Math.round((Date.now() - startedAt) / 1000) : 0;

      let graded = [];
      if (config.retry) {
        graded = questions.map(q => ({ id: q.id, is_correct: answers[q.id] === q.correct, correct: q.correct }));
      } else {
        try {
          const payload = {};
          questions.forEach(q => { payload[q.id] = answers[q.id] || null; });
          const { data, error } = await supabase.rpc('submit_test', { p_mode: config.mode, p_answers: payload, p_note: config.noteId || null });
          if (error) throw error;
          graded = data || [];
        } catch (e) {
          console.error(e);
          toast('Could not save your result. Check your connection and submit again.');
          submitting = false;
          if (secondsLeft > 0) startTimer(0, endsAt);
          return;
        }
      }

      // explanations (server-side, only fetched after grading)
      const expMap = Object.assign({}, customExp);
      if (!config.retry) {
        try {
          const ids = questions.map(q => String(q.id)).filter(i => !/^n\d+$/.test(i));
          if (ids.length) {
            const { data } = await supabase.rpc('question_explanations', { p_ids: ids });
            (data || []).forEach(r => { if (r.explanation) expMap[String(r.id)] = r.explanation; });
          }
        } catch (e) { /* optional */ }
      }
      questions.forEach(q => { if (q.exp && !expMap[q.id]) expMap[q.id] = q.exp; });

      let correct = 0;
      const bySubject = {};
      const review = [];
      const byId = {};
      graded.forEach(g => { byId[g.id] = g; });
      questions.forEach(q => {
        const g = byId[q.id] || {};
        const sub = q.subject || 'Mixed';
        if (!bySubject[sub]) bySubject[sub] = { score: 0, total: 0 };
        bySubject[sub].total++;
        const isCorrect = !!g.is_correct;
        if (isCorrect) { correct++; bySubject[sub].score++; }
        review.push({ t: questionTimes[q.id] != null ? questionTimes[q.id] : null, q: q.question, chosen: answers[q.id] || null, correct: g.correct || null, isCorrect, exp: expMap[q.id] || '', subject: sub, flagged: !!flags[q.id] });
      });

      try { localStorage.removeItem('stride_test_config'); } catch (e) {}
      clearProgress();

      // mistake bank: add misses, drop anything now answered correctly
      try {
        let bank = getMistakes();
        const missed = [];
        questions.forEach(q => {
          const g = byId[q.id] || {};
          if (/^n\d+$/.test(String(q.id))) return;
          const prev = bank.find(m => String(m.id) === String(q.id));
          bank = bank.filter(m => String(m.id) !== String(q.id));
          if (!g.is_correct && g.correct) {
            const miss = prev ? (prev.misses || 1) + 1 : 1;
            const days = miss <= 1 ? 1 : miss === 2 ? 3 : 7;
            missed.push({ misses: miss, due: Date.now() + days * 86400000, id: q.id, question: q.question, option_a: q.option_a, option_b: q.option_b, option_c: q.option_c, option_d: q.option_d, subject: q.subject, year: q.year, difficulty: q.difficulty, image_url: q.image_url || null, correct: g.correct, exp: expMap[q.id] || '' });
          }
        });
        setMistakes(missed.concat(bank));
      } catch (e) {}

      const streakInfo = config.retry ? null : await countStreak();
      showResult(correct, total, bySubject, timeTaken, review, streakInfo);
    }

    // A day only counts toward the streak once a test is submitted.
    async function countStreak() {
      try {
        const ymd = d => d.toLocaleDateString('en-CA');
        const today = ymd(new Date());
        const y = new Date(); y.setDate(y.getDate() - 1);
        const { data: p } = await supabase.from('profiles').select('streak_count,last_login_date').eq('id', currentUser.id).single();
        if (!p) return null;
        if (p.last_login_date === today) return { n: p.streak_count || 1, isNew: false };
        const n = p.last_login_date === ymd(y) ? (p.streak_count || 0) + 1 : 1;
        const { error } = await supabase.from('profiles').update({ streak_count: n, last_login_date: today }).eq('id', currentUser.id);
        if (error) throw error;
        try { localStorage.setItem('stride_streak_pop', String(n)); } catch (e) {}
        return { n, isNew: true };
      } catch (e) { console.error(e); return null; }
    }

    function showResult(correct, total, bySubject, timeTaken, review, streakInfo) {
      const pct = Math.round((correct / total) * 100);
      const tone = pct >= 75 ? 'good' : pct >= 50 ? 'mid' : '';
      const subjRows = Object.entries(bySubject).map(([subj, s]) => {
        const p = Math.round((s.score / s.total) * 100);
        const t = p >= 75 ? '' : p >= 50 ? 'mid' : 'lo';
        return `<div class="subj-row ${t}">
          <span class="name">${escapeHtml(subj)}</span>
          <span class="score">${s.score}/${s.total}</span>
          <div class="bar"><div style="width:${p}%"></div></div>
        </div>`;
      }).join('');

      $('#nav-bar').hidden = true;
      $('#timer').hidden = true;
      $('#grid-btn').hidden = true;

      const subs = Object.values(bySubject);
      const avgFrac = subs.length ? subs.reduce((a, s) => a + s.score / s.total, 0) / subs.length : 0;
      const jamb = Math.round(avgFrac * 400);
      let target = 0; try { target = +localStorage.getItem('stride_target') || 0; } catch (e) {}
      const gapTxt = target ? (jamb >= target ? `<div class="gap good"><i data-lucide="target" style="width:14px;height:14px;vertical-align:-2px"></i> ${jamb - target} above your target of ${target}</div>` : `<div class="gap bad">${target - jamb} points to your target of ${target}</div>`) : '';
      const jambHtml = config.retry ? '' : `<div class="jamb"><div class="k">${config.mode === 'mock' ? 'JAMB score' : 'Estimated JAMB score'}</div><div class="v"><span id="jamb-n">0</span><small> / 400</small></div>${gapTxt}</div>`;

      $('#main').innerHTML = `
        <div class="result-screen">
          <div class="result-hero">
            <div class="result-pct ${tone}">${pct}%</div>
            <div class="result-sub">${correct} of ${total} correct</div>
            <div class="result-time">Completed in ${formatTime(timeTaken)}</div>
          </div>

          ${jambHtml}
          <div class="percentile" id="percentile" style="text-align:center;color:#97D86E;font-size:.9rem;margin:-4px 0 10px"></div>

          ${streakInfo ? `<div class="streak-banner ${streakInfo.isNew ? 'fresh' : ''}"><span class="fl"><i data-lucide="flame" style="width:1.9rem;height:1.9rem;color:#EB7650"></i></span><div><b>${streakInfo.n}-day streak</b><small>${streakInfo.isNew ? 'Streak extended — nice work!' : 'Already counted today. Keep going!'}</small></div></div>` : ''}

          ${subjRows ? `<div class="result-breakdown"><h3>By subject</h3>${subjRows}</div>` : ''}

          <div class="result-actions">
            <button class="nav-btn next" id="review-btn">
              <i data-lucide="list-checks"></i> Review answers
            </button>
            <button class="nav-btn next" id="share-btn">Share <i data-lucide="share-2"></i></button>
            ${getMistakes().length && !config.retry ? `<button class="nav-btn prev" id="retry-btn"><i data-lucide="rotate-ccw"></i> Retry missed (${getMistakes().length})</button>` : ''}
            <button class="nav-btn prev" id="home-btn">
              <i data-lucide="home"></i> Back to app
            </button>
          </div>
        </div>
      `;
      icons();
      window.scrollTo({ top: 0, behavior: 'smooth' });

      $('#review-btn').addEventListener('click', () => showReview(review));
      const rb = $('#retry-btn');
      if (rb) rb.addEventListener('click', () => {
        try { localStorage.setItem('stride_test_config', JSON.stringify({ retry: true, mode: 'practice', subjects: ['Mistakes'], year: 'all', count: 20, sid: 'r' + Date.now() })); } catch (e) {}
        location.replace('test.html');
      });
      const countUp = (el, to, ms) => { if (!el) return; const t0 = performance.now(); const f = n => { const k = Math.min(1, (n - t0) / ms); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); }; requestAnimationFrame(f); };
      countUp($('#jamb-n'), jamb, 1100);
      $('#home-btn').addEventListener('click', () => location.replace('app.html'));

      // history
      try { localStorage.setItem('stride_result_' + Date.now(), JSON.stringify({ pct, jamb, total, correct, date: new Date().toISOString(), mode: config.mode })); } catch (e) {}

      // share
      $('#share-btn').addEventListener('click', async () => {
        const text = `I scored ${pct}% (${correct}/${total}) on Stride. Estimated JAMB: ${jamb}/400.`;
        const url = location.origin + location.pathname.replace(/[^/]*$/, '');
        if (navigator.share) { try { await navigator.share({ text, url }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
        try { await navigator.clipboard.writeText(text + ' ' + url); toast('Copied to clipboard'); }
        catch (e) { window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank'); }
      });

      // percentile (leaderboard returns top 10 only, so show rank when the user is on it)
      if (!config.retry) {
        supabase.rpc('leaderboard_v2', { p_days: 0, p_subject: null, p_course: null }).then(({ data }) => {
          const rows = data || [];
          const i = rows.findIndex(r => r.id === currentUser.id);
          const el = $('#percentile');
          if (el && i >= 0) el.textContent = `You're #${i + 1} on the all-time leaderboard`;
        }).catch(() => {});
      }
    }

    function showReview(review, only) {
      const ts = review.map(r => r.t).filter(t => t != null);
      const avgT = ts.length ? ts.reduce((a, b) => a + b, 0) / ts.length : null;
      const list = review.map((r, i) => ({ r, i })).filter(x => !only || !x.r.isCorrect);
      const items = list.map(({ r, i }, n) => {
        const rowClass = r.isCorrect ? 'correct' : 'wrong';
        const yourTxt = r.chosen
          ? `${r.chosen.toUpperCase()} — ${escapeHtml(questions[i]['option_' + r.chosen] || '')}`
          : 'Not answered';
        const correctTxt = r.correct ? `${r.correct.toUpperCase()} — ${escapeHtml(questions[i]['option_' + r.correct] || '')}` : '—';
        return `<div class="review-item ${rowClass}" style="animation-delay:${Math.min(n, 12) * 40}ms">
          <div class="review-q"><b style="color:var(--muted);font-weight:400">Q${i + 1}.</b> ${escapeHtml(r.q)}${r.flagged ? ' <i data-lucide="flag" style="width:13px;height:13px;color:#F8CB4A;vertical-align:-2px"></i>' : ''}${r.t != null && r.t < 5 ? ' <span style="color:#F8CB4A;font-size:.75rem">rushed</span>' : ''}</div>
          <div class="review-ans">
            <div class="row"><span class="lbl">Your answer</span><span class="val ${r.isCorrect ? 'good' : 'bad'}">${yourTxt}</span></div>
            ${!r.isCorrect ? `<div class="row"><span class="lbl">Correct</span><span class="val good">${correctTxt}</span></div>` : ''}
          </div>
          ${r.exp ? `<div class="review-exp"><b>Explanation</b>${escapeHtml(r.exp)}</div>` : ''}
        </div>`;
      }).join('') || '<p style="color:var(--muted);text-align:center;padding:30px 0">Nothing wrong here.</p>';

      $('#main').innerHTML = `
        <div class="result-screen">
          <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h1 style="font-size:1.6rem;font-weight:400;letter-spacing:-0.03em">Review</h1>
            <button class="back-btn" id="review-back" aria-label="Back to result"><i data-lucide="arrow-left"></i></button>
          </header>
          ${avgT != null ? `<div style="color:var(--muted);font-size:.85rem;margin-bottom:10px">Avg time per question: ${avgT.toFixed(1)}s</div>` : ''}
          <div class="rv-tabs"><button data-f="all" class="${only ? '' : 'on'}">All</button><button data-f="wrong" class="${only ? 'on' : ''}">Wrong only</button></div>
          <div class="review-list">${items}</div>
        </div>
      `;
      icons();
      renderMathInElement($('#main'), {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ]
      });
      window.scrollTo({ top: 0, behavior: 'smooth' });
      $('#review-back').addEventListener('click', () => location.replace('app.html'));
      $$('.rv-tabs button').forEach(b => b.addEventListener('click', () => showReview(review, b.dataset.f === 'wrong')));
    }

    function showEmpty(title, msg) {
      $('#nav-bar').hidden = true;
      $('#main').innerHTML = `
        <div class="empty-state">
          <div class="em-ic"><i data-lucide="book-x"></i></div>
          <h2>${escapeHtml(title)}</h2>
          <p>${escapeHtml(msg)}</p>
          <button class="nav-btn next" onclick="location.replace('app.html')">
            <i data-lucide="arrow-left"></i> Back to practice
          </button>
        </div>
      `;
      icons();
    }

    async function init() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { html.style.visibility = 'hidden'; return location.replace('index.html'); }
      currentUser = session.user;
      try {
        const bu = localStorage.getItem('stride_bound_user');
        if (bu && bu !== currentUser.id && localStorage.getItem('stride_bound_device') === localStorage.getItem('stride_device_id') && (currentUser.email || '').toLowerCase() !== 'estdavid10@gmail.com') {
          const { data: pr } = await supabase.from('profiles').select('role').eq('id', currentUser.id).single();
          if (!pr || pr.role !== 'admin') { try { localStorage.setItem('stride_login_notice', 'Device bound to another account'); } catch (e) {} await supabase.auth.signOut(); return location.replace('index.html'); }
        }
      } catch (e) {}

      let raw = null;
      try { raw = localStorage.getItem('stride_test_config'); } catch (e) {}
      if (!raw) { return location.replace('app.html'); }
      try { config = JSON.parse(raw); } catch (e) { return location.replace('app.html'); }
      if (!config || !config.subjects || !config.subjects.length || !config.count) {
        return location.replace('app.html');
      }

      let resumed = null;
      try {
        const r = JSON.parse(localStorage.getItem(RK) || 'null');
        if (r && r.uid === currentUser.id && r.sid && r.sid === config.sid && Date.now() - r.ts < 864e5) resumed = r;
        else if (r) localStorage.removeItem(RK);
      } catch (e) {}
      if (!config.sid) config.sid = 's' + Date.now();
      try { localStorage.setItem('stride_test_config', JSON.stringify(config)); } catch (e) {}

      let loaded = [];
      try {
        loaded = resumed ? resumed.questions : await loadQuestions(config);
      } catch (e) {
        console.error(e);
        html.style.visibility = 'visible';
        return showEmpty('Could not load questions', 'There was a problem reaching the database. Please try again from the Practice screen.');
      }

      if (!loaded.length) {
        html.style.visibility = 'visible';
        return showEmpty(
          'No questions yet',
          `There are no questions for ${config.subjects.join(', ')} ${config.year !== 'all' ? 'in ' + config.year : ''}. Add some in your Supabase questions table, or try a different subject or year.`
        );
      }

      questions = loaded;
      startedAt = Date.now();
      if (resumed) {
        answers = resumed.answers || {}; flags = resumed.flags || {}; customExp = resumed.customExp || {};
        currentIndex = Math.min(resumed.idx || 0, questions.length - 1); startedAt = resumed.startedAt || startedAt;
      }

      html.style.visibility = 'visible';
      $('#nav-bar').hidden = false;
      $('#grid-btn').hidden = false;
      renderQuestion();
      if (resumed) toast('Welcome back — your progress was restored.');

      if (config.mode === 'timed') {
        if (config.time && config.time > 0) startTimer(config.time, resumed && resumed.endsAt);
      } else if (config.mode === 'mock') {
        startTimer(config.time || 120, resumed && resumed.endsAt);
      }
      saveProgress();
      icons();
    }

    init();
  })();
  </script>
</body>
</html>
